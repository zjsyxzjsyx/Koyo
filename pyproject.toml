[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhiqiu"
version = "7.2.0"
description = "A local-first CLI learning agent with durable review tasks"
requires-python = ">=3.12"
dependencies = [
  "fsrs==6.3.2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Official MCP Python SDK (MIT); only needed for `zhiqiu mcp` and MCP client tools.
mcp = ["mcp>=1.10,<2"]
# Local voice input (SenseVoice-Small via sherpa-onnx, Apache-2.0; pypinyin, MIT); model files are downloaded by hand.
# sherpa-onnx-core is listed too: resolved from the sdist the lock misses it, and Windows then loads the
# system's older onnxruntime.dll instead of the one it ships.
voice = ["sherpa-onnx>=1.12,<2", "sherpa-onnx-core>=1.12,<2", "numpy>=1.26", "pypinyin>=0.51,<1"]

[project.scripts]
zhiqiu = "zhiqiu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiqiu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
