[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhiqiu"
version = "6.1.0"
description = "A local-first CLI learning agent with durable review tasks"
requires-python = ">=3.12"
dependencies = [
  "fsrs==6.3.2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Official MCP Python SDK (MIT); only needed for `zhiqiu mcp` and MCP client tools.
mcp = ["mcp>=1.10,<2"]

[project.scripts]
zhiqiu = "zhiqiu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiqiu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
