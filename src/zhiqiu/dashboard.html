<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知秋看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23BA7517'/%3E%3Cpath d='M32 7L36.5 16L41 14L39 26L46 19L48 23.5L55 22L52 30L55 32L44 40L45.5 44L34 42.5L30 42.5L18.5 44L20 40L9 32L12 30L9 22L16 23.5L18 19L25 26L23 14L27.5 16Z' fill='white'/%3E%3Cpath d='M32 42L32 53' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#BA7517">
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --soft: #f3f2f0; --line: #e7e6e4; --line2: #d9d8d5;
  --ink: #21201d; --ink2: #6f6e69; --ink3: #a3a29d;
  --accent: #5e6ad2; --accent-soft: #eef0fb;
  --good: #1f7a4d; --good-soft: #e8f4ee; --bad: #c0392b; --bad-soft: #faeceb; --warn: #a76a12; --warn-soft: #fbf1e1;
  --k-turn: #8a8984; --k-flow: #7c6bd6; --k-stage: #5e6ad2; --k-loop: #2f9b8a; --k-llm: #4f8fd6; --k-tool: #c48a2c;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101012; --panel: #18181b; --soft: #202024; --line: #26262a; --line2: #333338;
    --ink: #ececea; --ink2: #96959f; --ink3: #5f5e66;
    --accent: #7c8aec; --accent-soft: #20223a;
    --good: #4cc38a; --good-soft: #12291d; --bad: #e5655a; --bad-soft: #331714; --warn: #e0a64a; --warn-soft: #2e2210;
    --k-turn: #77767f; --k-flow: #a593f0; --k-stage: #7c8aec; --k-loop: #45c2ae; --k-llm: #6aa9ea; --k-tool: #e0a64a;
  }
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); display: flex; height: 100vh; overflow: hidden;
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
svg.i { width: 15px; height: 15px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
nav { width: 212px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; overflow-y: auto; }
.brand { font-weight: 650; font-size: 15px; padding: 0 10px; }
.brand small { display: block; color: var(--ink3); font-weight: 400; font-size: 11px; margin-top: 2px; }
.grp { font-size: 10.5px; letter-spacing: .08em; color: var(--ink3); padding: 18px 10px 4px; }
nav a { display: flex; align-items: center; gap: 9px; color: var(--ink2); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 13.5px; margin-top: 2px; cursor: pointer; }
nav a:hover { background: var(--panel); color: var(--ink); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
nav a .n { margin-left: auto; font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
nav a .n.hot { color: var(--bad); font-weight: 600; }
nav a .n.live { color: var(--good); font-weight: 600; }
.navfoot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink3); display: grid; gap: 6px; }
.navfoot select { font: inherit; color: var(--ink2); background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 2px 6px; }
#dbname { font-family: var(--mono); color: var(--ink2); word-break: break-all; }
#pulse.err { color: var(--bad); }
.draft > :last-child::after, .draft:empty::after { content: "▍"; color: var(--ink3); animation: draftblink 1s steps(2, start) infinite; }
@keyframes draftblink { to { visibility: hidden; } }
main { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 0 36px 40px; }
main.chatview { padding-bottom: 0; }
.pagehead { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 24px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; display: flex; align-items: flex-end; gap: 12px; }
.pagehead h1 { font-size: 17px; font-weight: 600; }
.pagehead .sub { color: var(--ink3); font-size: 12px; font-family: var(--mono); }
.pagehead .act { margin-left: auto; }
h2 { font-size: 11px; letter-spacing: .08em; color: var(--ink2); font-weight: 600; margin: 26px 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.tile b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { color: var(--ink2); font-size: 11.5px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; background: var(--soft); color: var(--ink2); }
.pill.ok, .pill.pass, .pill.done { background: var(--good-soft); color: var(--good); }
.pill.error, .pill.fail { background: var(--bad-soft); color: var(--bad); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.interrupted, .pill.insufficient, .pill.warn { background: var(--warn-soft); color: var(--warn); }
.muted { color: var(--ink2); } .faint { color: var(--ink3); } .mono { font-family: var(--mono); font-size: 12px; }
a.lnk, .lnk { color: var(--accent); cursor: pointer; text-decoration: none; } .lnk:hover { text-decoration: underline; }
.empty { color: var(--ink3); padding: 18px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--ink3); font-weight: 500; font-size: 11.5px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
.dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; background: var(--good); flex-shrink: 0; }
.dot.live { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.runhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.runhead b { font-size: 15px; }
.steps { display: flex; gap: 6px; margin: 16px 0 6px; }
.step { flex: 1; min-width: 0; }
.step .bar { height: 4px; border-radius: 2px; background: var(--line2); }
.step.done .bar { background: var(--good); } .step.running .bar { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.step.error .bar { background: var(--bad); }
.step .lbl { margin-top: 6px; font-size: 12.5px; color: var(--ink3); }
.step.done .lbl, .step.error .lbl { color: var(--ink2); } .step.running .lbl { color: var(--accent); font-weight: 600; }
.step .det { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The live architecture diagram: boxes light up as the trace feed passes through them. */
.archwrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.arch { display: block; width: 100%; min-width: 860px; height: auto; }
.arch .zone { fill: color-mix(in srgb, var(--z) 6%, transparent); stroke: color-mix(in srgb, var(--z) 45%, transparent); stroke-width: 1.3; }
.arch .zone.sub { fill: color-mix(in srgb, var(--z) 9%, var(--panel)); stroke-dasharray: 5 4; }
.arch .zl { fill: var(--z); font-size: 12px; letter-spacing: .04em; font-weight: 650; }
.arch .zd { fill: var(--ink3); font-size: 11px; }
.arch .node rect, .arch .node .dia { fill: var(--panel); stroke: var(--line2); stroke-width: 1.3; transition: fill .25s, stroke .25s; }
.arch .node .nt { fill: var(--ink); font-size: 13px; font-weight: 600; }
.arch .node .ns { fill: var(--ink3); font-size: 11px; }
.arch .node.link { cursor: pointer; }
.arch .node.link:hover rect, .arch .node.link:hover .dia { stroke: var(--accent); }
.arch .flow { fill: none; stroke: var(--ink3); stroke-width: 1.3; marker-end: url(#zarr); }
.arch .flow.dash { stroke-dasharray: 4 3; opacity: .8; }
.arch .head { fill: var(--ink3); }
.arch .fl { fill: var(--ink3); font-size: 10.5px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.arch .node.on rect, .arch .node.on .dia { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.arch .node.hot rect, .arch .node.hot .dia { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
.arch .node.err rect, .arch .node.err .dia { stroke: var(--bad); stroke-width: 3; fill: var(--bad-soft); }
.arch .node.wait .dia { stroke: var(--warn); stroke-width: 3; fill: var(--warn-soft); }
.arch .node rect.zone { fill: color-mix(in srgb, var(--z) 6%, transparent); stroke: color-mix(in srgb, var(--z) 45%, transparent); }
.arch .node.on rect.zone, .arch .node.hot rect.zone { stroke: var(--accent); stroke-width: 2.4; }
.arch .flow.live { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 6 5; opacity: 1; animation: flowdash .8s linear infinite; }
@keyframes flowdash { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .arch .flow.live { animation: none; } .arch .node rect, .arch .node .dia { transition: none; } }
.archstat { display: flex; gap: 8px; align-items: center; min-height: 22px; margin: 8px 2px 0; font-size: 12.5px; color: var(--ink2); }
.livefeed { padding: 6px 14px; }
.livefeed .ev { display: grid; grid-template-columns: 62px 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.livefeed .ev:first-child { border-top: 0; }
.livefeed .ev .t { color: var(--ink3); font-family: var(--mono); font-size: 11.5px; }
.livefeed .ev.bad { color: var(--bad); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; font-size: 12.5px; }
.chain .c { padding: 2px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: inline-flex; gap: 6px; align-items: center; }
.chain .c.last { border-color: var(--accent); color: var(--accent); }
.chain .sep { color: var(--ink3); }
.filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.acard select[data-grant-root] { font: inherit; font-size: 12.5px; max-width: 100%; width: 100%; margin-top: 4px; padding: 3px 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); color: var(--ink); }
.filters input, .filters select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 9px; }
.filters input { flex: 1; min-width: 160px; }
.minibar { position: relative; height: 6px; background: var(--soft); border-radius: 3px; min-width: 80px; }
.minibar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--k-stage); }
.minibar span.error { background: var(--bad); } .minibar span.running { background: var(--accent); animation: pulse 1.4s infinite; }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
.tree { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; font-size: 12.5px; margin-bottom: 12px; }
.axis { display: grid; grid-template-columns: minmax(0, 1fr) 34% 64px; padding: 4px 12px 6px; color: var(--ink3); font-size: 10.5px; border-bottom: 1px solid var(--line); }
.axis div:nth-child(2) { display: flex; justify-content: space-between; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 34% 64px; align-items: center; padding: 3px 12px; cursor: pointer; min-height: 26px; }
.row:hover { background: var(--soft); } .row.sel { background: var(--accent-soft); }
.row .name { display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
.row .name .t { overflow: hidden; text-overflow: ellipsis; }
.row .tog { width: 14px; color: var(--ink3); text-align: center; flex-shrink: 0; font-size: 10px; }
.row .track { position: relative; height: 10px; margin: 0 8px; }
.row .track span { position: absolute; top: 2px; height: 6px; border-radius: 3px; min-width: 2px; }
.row .track i { position: absolute; top: 1px; width: 8px; height: 8px; transform: rotate(45deg); margin-left: -4px; }
.row .dur { text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.row.err .t { color: var(--bad); }
.k-turn, .k-command { color: var(--k-turn); } .k-flow { color: var(--k-flow); } .k-stage { color: var(--k-stage); }
.k-loop { color: var(--k-loop); } .k-llm { color: var(--k-llm); } .k-tool { color: var(--k-tool); } .k-event { color: var(--k-flow); } .k-guard { color: var(--bad); }
.bg-turn, .bg-command { background: var(--k-turn); } .bg-flow { background: var(--k-flow); } .bg-stage { background: var(--k-stage); }
.bg-loop { background: var(--k-loop); } .bg-llm { background: var(--k-llm); } .bg-tool { background: var(--k-tool); } .bg-err { background: var(--bad) !important; }
.bg-run { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 3px, transparent 3px 6px); }
.detail { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; max-height: calc(100vh - 100px); overflow-y: auto; font-size: 13px; }
.detail h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 10px; font-size: 12.5px; margin: 8px 0; }
.kv dt { color: var(--ink3); } .kv dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
.errbox { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 7px 10px; margin: 8px 0; font-size: 12.5px; }
pre.code { background: var(--soft); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; color: var(--ink2); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; margin: 6px 0; }
.msg { border-left: 2px solid var(--line2); padding: 2px 0 2px 10px; margin: 8px 0; }
.msg .role { font-size: 11px; color: var(--ink3); }
details summary { cursor: pointer; color: var(--ink2); font-size: 12px; margin-top: 8px; }
.hint { font-size: 11.5px; color: var(--ink3); margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
svg text { fill: var(--ink3); font-size: 10.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink3); font-size: 11.5px; margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 48px; align-items: center; gap: 8px; font-size: 12.5px; margin: 5px 0; }
.hbar .b { height: 8px; background: var(--soft); border-radius: 4px; position: relative; }
.hbar .b span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.q { padding: 10px 0; border-bottom: 1px solid var(--line); } .q:last-child { border-bottom: 0; }
.q .meta { color: var(--ink3); font-size: 11.5px; }
.ans { background: var(--soft); border-radius: 6px; padding: 6px 10px; margin-top: 6px; white-space: pre-wrap; }
.score { font-size: 22px; font-weight: 600; } .score small { font-size: 12px; color: var(--ink3); font-weight: 400; }
blockquote { margin: 6px 0; padding: 4px 10px; border-left: 2px solid var(--accent); background: var(--soft); font-size: 12.5px; }
/* Workbench chat */
.stream { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.bubble { max-width: min(760px, 88%); padding: 9px 13px; border-radius: 12px; word-break: break-word; }
.bubble.user { align-self: flex-end; background: var(--accent-soft); white-space: pre-wrap; border-bottom-right-radius: 4px; }
.bubble.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.old { opacity: .72; }
.note { align-self: flex-start; font-size: 12.5px; color: var(--ink3); display: flex; gap: 6px; align-items: baseline; white-space: pre-wrap; word-break: break-word; }
.note.err { color: var(--bad); }
.divider { text-align: center; font-size: 11.5px; color: var(--ink3); margin: 6px 0; }
.acard { align-self: flex-start; width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--warn); border-radius: 10px; padding: 12px 14px; }
.acard.ask { border-left-color: var(--accent); }
.acard.done { border-left-color: var(--line2); opacity: .8; }
.acard .head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.acard .acts { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.acard .result { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
.acard.plan { border-left-color: var(--accent); width: min(860px, 100%); }
.acard.plan .sum { font-size: 12.5px; color: var(--ink2); margin: 4px 0 2px; }
.acard.plan .warn { font-size: 12.5px; color: var(--warn); margin-top: 4px; }
.acard.plan .pace { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; margin: 8px 0 4px; }
.acard.plan .pace input { font: inherit; font-size: 12.5px; width: 64px; padding: 2px 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); color: var(--ink); }
.acard.plan .pace input[type=date] { width: 132px; }
.acard.plan .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
.acard.plan .seg button { font: inherit; font-size: 12px; padding: 2px 10px; border: 0; background: var(--panel); color: var(--ink2); cursor: pointer; }
.acard.plan .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.acard.plan .ptable { width: 100%; overflow-x: auto; margin-top: 6px; }
.acard.plan table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.acard.plan td, .acard.plan th { padding: 5px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.acard.plan th { color: var(--ink3); font-weight: 500; font-size: 11.5px; border-top: 0; }
.acard.plan tr.rday td { color: var(--ink3); font-style: italic; }
.acard.plan tr.skip td { color: var(--ink3); text-decoration: line-through; }
.acard.plan tr.skip td.ops, .acard.plan tr.skip td.st { text-decoration: none; }
.acard.plan td.ops { white-space: nowrap; }
.acard.plan td.ops button { font: inherit; font-size: 11.5px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 5px; background: var(--panel); color: var(--ink2); cursor: pointer; }
.acard.plan td.ops button:hover { border-color: var(--ink3); }
.acard.plan .goal { color: var(--ink3); font-size: 11.5px; }
.acard.plan .st { color: var(--ink2); font-size: 11.5px; }
.acard.plan .acts { flex-wrap: wrap; }
.acard.plan .acts .btn, .acard.plan td.day { white-space: nowrap; }
@media (max-width: 640px) {
  .acard.plan td.src, .acard.plan th.src, .acard.plan .goal:not(.req) { display: none; }
  .acard.plan td.ops button { display: block; width: 100%; margin: 2px 0; }
  .acard.plan td.day { white-space: normal; min-width: 4.5em; }
}
.ocard { align-self: flex-start; width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 14px; }
.ocard .head { font-weight: 600; margin-bottom: 6px; }
.ocard .dim { padding: 2px 0; }
.ocard .tip { color: var(--ink2); font-size: 12.5px; padding-left: 1.2em; }
.ocard .more { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.ocard .more .q { padding: 6px 0; border-top: 1px dashed var(--line); }
.ocard .more .q:first-child { border-top: 0; }
.btn { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--ink3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); }
.roots .rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.roots .rrow:first-of-type { border-top: 0; }

<script>
"use strict";
const ICONS = {
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11"/><line x1="12" y1="18" x2="12" y2="21"/>',

  list: '<line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',

  book: '<path d="M4 5 C7 4 10 4 12 6 C14 4 17 4 20 5 V19 C17 18 14 18 12 20 C10 18 7 18 4 19 Z"/><line x1="12" y1="6" x2="12" y2="20"/>',

  command: '<polyline points="5 8 9 12 5 16"/><line x1="11" y1="16" x2="19" y2="16"/>',
  flow: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6 H14 A4 4 0 0 1 14 14 H10 A4 4 0 0 0 10 22"/>',
  loop: '<path d="M20 12 A8 8 0 1 1 17.6 6.3"/><polyline points="20 4 20 9 15 9"/>',
  stage: '<rect x="5" y="5" width="14" height="14" rx="3"/>',

  tool: '<path d="M14.5 5.5 a4 4 0 0 0 4 5 L10 19 a2.1 2.1 0 0 1 -3 -3 L15.5 7.5 a4 4 0 0 0 -1 -2 Z"/>',
  event: '<path d="M12 4 L20 12 L12 20 L4 12 Z"/>',
  guard: '<path d="M12 3 L19 6 V11 C19 15.5 16 19 12 21 C8 19 5 15.5 5 11 V6 Z"/><line x1="12" y1="9" x2="12" y2="13"/>',
};
const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.stage}</svg>`;
document.querySelectorAll("[data-icon]").forEach((node) => { node.outerHTML = icon(node.dataset.icon); });

const STAGE = {assess: "资料评估", assess_chunk: "分段检查资料", assess_combine: "综合资料判断", teach: "讲解", clarify: "澄清",
  clarify_chunk: "分段澄清", clarify_combine: "综合澄清", next_question: "出题", grade: "评分", grade_extract: "分批评阅",
  grade_segment: "分段评阅", grade_combine: "维度合并评分", gather: "补充资料", synthesize: "归纳旧讲解", synthesize_batch: "分批归纳",
  chat: "对话", chat_summary: "对话摘要", classify_turn: "识别输入", plan: "制定计划"};
const FLOW = {learn: "学习", quiz: "自测", review: "复习", resume_lesson: "继续讲解", "plan.draft": "生成计划草稿",
  "plan.activate": "确认计划", "plan.revise": "修改计划", "plan.web_outline": "联网参考大纲", "plan.recompute": "重排计划"};
const DIM = {concept: "概念准确", mechanism: "机制解释", application: "应用辨析"};
const STATUS = {running: "运行中", ok: "完成", error: "出错", interrupted: "中断", done: "完成", pending: "未开始"};
const END = {done: "完成", outcome: "已评阅", proposal: "提出建议", cancelled: "已取消", no_answer: "无回答", error: "出错",
  max_rounds: "达到轮数上限", deadline: "超时", budget: "超预算", paused: "已暂停", ended: "已结束", interrupted: "已中断", process_exited: "进程已退出"};
const KIND = {first: "首次自测", review: "复习"};
const RULE = {leak_check: "泄露检查", read_root: "读取白名单", write_root: "写入白名单", name_not_allowed: "工具不在本步骤",
  permission_denied: "权限类别不允许", confirmation_denied: "用户拒绝确认", confirmation_unavailable: "无法确认", policy_denied: "审批策略禁止", web_request_refused: "网页请求被拒",
  proposal_rejected: "拒绝提议", proposal_refused: "提议未通过校验", memory_limit: "记忆超限", loop_limit: "循环上限", question_shape: "题目形状超限",
  output_invalid: "模型输出无效", illegal_transition: "非法状态转换", consent_missing: "未获发送授权",
  endpoint_feature_disabled: "端点不支持的字段", plan_limit: "学习计划超限"};
const VIEWS = {live: "实时", traces: "Trace", metrics: "指标与花费", failures: "失败", checks: "契约检查", approvals: "审批", schedule: "复习日程", learn: "学习记录", roots: "目录白名单", plans: "学习计划"};
// Served by `zhiqiu web`, the page carries a per-start token for /api/chat/*; the read-only dashboard has none.
const meta = (name) => document.querySelector(`meta[name="${name}"]`)?.content || "";
const WB = {on: meta("zhiqiu-mode") === "workbench", token: meta("zhiqiu-token")};
if (WB.on) VIEWS.chat = "对话";
const DEFAULT_VIEW = WB.on ? "chat" : "live";
const APPROVAL = {pending: ["running", "待审批"], approved: ["ok", "已批准"], denied: ["warn", "已拒绝"], cancelled: ["interrupted", "已取消"]};
const GRANT = {once: "只允许这一次", root: "已加入白名单", denied: "拒绝"};
const VIA = {terminal: "终端", web: "网页"};

const S = {view: "live", arg: null, days: 7, currency: "", trees: null, selected: null, collapsed: new Set(), timer: null, llm: {}, states: false};
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (v) => (v ?? 0).toLocaleString("zh-CN");
const pct = (v) => v == null ? "—" : (v * 100).toFixed(1) + "%";
const money = (v, cur = S.currency) => v == null ? "—" : `${cur}${v < 0.01 ? v.toFixed(4) : v.toFixed(3)}`;
const ms = (v) => v == null ? "运行中" : v < 1000 ? `${v}ms` : v < 60000 ? `${(v / 1000).toFixed(1)}s` : `${Math.floor(v / 60000)}分${Math.round(v % 60000 / 1000)}秒`;
const clock = (ns) => ns ? new Date(ns / 1e6).toLocaleString("zh-CN", {hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "—";
// How a gated tool call was decided; rows from before schema v19 have no source and read as the user's.
const approvalLabel = (n) => n.confirmed === 0 ? "被拒" : n.confirmed !== 1 ? "无需确认"
  : ({policy: "策略放行", turn: "本轮已允许"})[n.approval_source] || "用户批准";
const pill = (status, text) => `<span class="pill ${esc(status)}">${esc(text ?? STATUS[status] ?? status)}</span>`;
const go = (hash) => { if (location.hash !== hash) location.hash = hash; else route(); };

async function api(path) {
  // Chat content and the root settings exist only in the workbench, and only answer our page's token.
  const headers = /^\/api\/(chat|roots|files)(\/|$)/.test(path.split("?")[0]) ? {"X-Zhiqiu-Token": WB.token} : {};
  const response = await fetch(path, {cache: "no-store", headers});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function post(path, body) {
  const response = await fetch(path, {method: "POST", cache: "no-store", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json", "X-Zhiqiu-Token": WB.token}});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function pulse(error) {
  const node = $("#pulse");
  if (!error && S.view === "chat" && C.liveText) { node.className = ""; node.textContent = C.liveText; return; }
  node.className = error ? "err" : "";
  node.textContent = error ? `读取失败：${error}` : `已更新 ${new Date().toLocaleTimeString("zh-CN", {hour12: false})}`;
}

function spanLabel(s) {
  const point = s.point ? `：${s.point}` : "";
  if (s.kind === "flow") return (FLOW[s.name] || s.name) + point;
  if (s.kind === "stage") return STAGE[s.name] || s.name;
  if (s.kind === "loop") return `工具循环 · ${STAGE[s.name] || s.name}`;
  if (s.kind === "turn") return s.name === "chat" ? "对话一轮" : `对话命令 ${s.name}`;
  return `zhiqiu ${s.name}${point}`;
}

function progressText(p) {
  if (!p) return "";
  const parts = [];
  if (p.step) parts.push(p.step);
  if (p.question) parts.push(`第 ${p.question} 题`);
  if (p.dimension) parts.push(DIM[p.dimension] || p.dimension);
  if (p.followup) parts.push("追问");
  if (p.round) parts.push(`第 ${p.round}/${p.max_rounds || "?"} 轮`);
  if (p.tool) parts.push(`调用 ${p.tool}`);
  if (p.closing) parts.push("收尾回答");
  return parts.join(" · ");
}

function setHead(title, sub = "", act = "") {
  $("#title").textContent = title;
  $("#sub").textContent = sub;
  $("#act").innerHTML = act;
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.view === S.view));
}

document.addEventListener("click", (event) => {
  const respond = event.target.closest("[data-respond]");
  if (respond) { chatRespond(respond); return; }
  const planAction = event.target.closest("[data-plan-act]");
  if (planAction) { planAct(planAction); return; }
  const planDetail = event.target.closest("[data-plan-detail]");
  if (planDetail) { location.hash = `plans/${encodeURIComponent(planDetail.dataset.planDetail)}`; return; }
  const vinstall = event.target.closest("[data-vinstall]");
  if (vinstall) { if (vinstall.dataset.vinstall === "go") voiceInstall(); else voiceHint(""); return; }
  const vundo = event.target.closest("[data-vundo],[data-vraw]");
  if (vundo) { voiceUndo(vundo); return; }
  const dgtext = event.target.closest("[data-dgtext]");
  if (dgtext) {
    const pre = dgtext.closest("figure").querySelector(".dgtext");
    pre.hidden = !pre.hidden;
    dgtext.textContent = pre.hidden ? "文字版" : "收起文字版";
    return;
  }
  const detail = event.target.closest("[data-detail]");
  if (detail) { outcomeDetail(detail); return; }
  const approve = event.target.closest("[data-approve]");
  if (approve) { approvalRespond(approve); return; }
  const rootButton = event.target.closest("[data-root-preview],[data-root-add],[data-root-cancel],[data-root-remove]");
  if (rootButton) { rootsAction(rootButton); return; }
  const review = event.target.closest("[data-review]");
  if (review) { schReview(review.dataset.review); return; }
  const fopen = event.target.closest("[data-fopen]");
  if (fopen) { event.preventDefault(); paneOpen(fopen.dataset.fopen); return; }
  const fdir = event.target.closest("[data-fdir]");
  if (fdir) { event.preventDefault(); paneBrowse(fdir.dataset.fdir); return; }
  const ftab = event.target.closest("[data-ftab]");
  if (ftab) {
    const close = event.target.closest("[data-fclose]");
    if (close) paneClose(close.dataset.fclose); else paneShow(ftab.dataset.ftab);
    return;
  }
  const fact = event.target.closest("[data-fcopy],[data-frefresh]");
  if (fact) {
    if (fact.dataset.fcopy !== undefined) navigator.clipboard?.writeText(fact.dataset.fcopy).then(() => pulse(), () => {});
    else paneLoad(fact.dataset.frefresh, true);
    return;
  }
  const remind = event.target.closest("[data-rnew],[data-rform],[data-rcancel],[data-rsnooze],[data-rok]");
  if (remind) { event.preventDefault(); remindAction(remind); return; }
  const compact = event.target.closest("[data-compact]");
  if (compact) { chatCompact(compact); return; }
  const cal = event.target.closest("[data-cal]");
  if (cal) { calNav(cal.dataset.cal); return; }
  const calDay = event.target.closest("[data-calday]");
  if (calDay) { C.cal.open = C.cal.open === calDay.dataset.calday ? "" : calDay.dataset.calday; calRender(); return; }
  const sch = event.target.closest("[data-sch]");
  if (sch) { schNav(sch.dataset.sch); return; }
  const cell = event.target.closest("[data-day]");
  if (cell) { SCH.open = SCH.open === cell.dataset.day ? "" : cell.dataset.day; viewSchedule().catch((e) => pulse(e.message)); return; }
  const nav = event.target.closest("[data-view]");
  if (nav) { go(`#${nav.dataset.view}`); return; }
  const trace = event.target.closest("[data-trace]");
  if (trace) { event.preventDefault(); go(`#trace/${trace.dataset.trace}`); return; }
  const attempt = event.target.closest("[data-attempt]");
  if (attempt) { event.preventDefault(); go(`#learn/${attempt.dataset.attempt}`); return; }
  if (event.target.matches("[data-states]")) { S.states = event.target.checked; renderTraceDetail(); return; }
  const row = event.target.closest(".row[data-node]");
  if (row) {
    if (event.target.closest(".tog") && row.dataset.kids === "1") {
      S.collapsed.has(row.dataset.node) ? S.collapsed.delete(row.dataset.node) : S.collapsed.add(row.dataset.node);
    } else {
      S.selected = row.dataset.node;
    }
    renderTraceDetail();
  }
});

function tiles(items) {
  return `<div class="tiles">${items.map(([label, value]) => `<div class="tile"><b>${value}</b><span>${esc(label)}</span></div>`).join("")}</div>`;
}

function stepBar(phases) {
  if (!phases || !phases.length) return "";
  return `<div class="steps">${phases.map((p) => {
    const detail = p.status === "running" ? (progressText(p.progress) || ms(p.duration_ms)) : p.status === "pending" ? "—" : ms(p.duration_ms);
    return `<div class="step ${p.status}"><div class="bar"></div><div class="lbl">${esc(p.label)}</div><div class="det">${esc(detail)}</div></div>`;
  }).join("")}</div>`;
}

// ----- the live architecture diagram (after waku's) ------------------------------------------------
// archSVG draws the boxes and arrows with data-node / data-edge ids; liveSpec says which of them each
// event of /api/live/events lights, and liveChain which stay lit while a span runs. The ids are used in
// both places: change one, change the other.
function archSVG() {
  const box = (id, x, y, w, h, title, view) => `<g class="node${view ? " link" : ""}" data-node="${id}"${view ? ` data-view="${view}"` : ""}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/><text class="nt" x="${x + 12}" y="${y + 20}">${title}</text>
    <text class="ns" data-sub="${id}" x="${x + 12}" y="${y + 37}">—</text></g>`;
  // A framed part in its own color (--z); the label and its note sit inside the frame, at the top or the bottom.
  const zone = (color, x, y, w, h, title, note = "", {id = "", view = "", sub = false, bottom = false} = {}) => {
    const ty = bottom ? y + h - 10 : y + 20;
    return `<g style="--z: var(${color})"${id ? ` class="node${view ? " link" : ""}" data-node="${id}"` : ""}${view ? ` data-view="${view}"` : ""}>
      <rect class="zone${sub ? " sub" : ""}" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/>
      <text class="zl" x="${x + 14}" y="${ty}">${title}</text>${note ? `<text class="zd" x="${x + 14 + title.length * 12.5 + 8}" y="${ty}">${note}</text>` : ""}</g>`;
  };
  const flow = (d, id = "", cls = "") => `<path class="flow ${cls}"${id ? ` data-edge="${id}"` : ""} d="${d}"/>`;
  const label = (x, y, text, anchor = "start") => `<text class="fl" x="${x}" y="${y}" text-anchor="${anchor}">${text}</text>`;
  const chat = WB.on ? "chat" : "";
  return `<svg class="arch" viewBox="0 0 1040 596" role="img" aria-label="知秋的运行结构，正在运行和刚发生的步骤会亮起">
    <defs><marker id="zarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
    ${zone("--k-llm", 16, 16, 780, 286, "一轮对话", "每条消息或命令走一遍")}
    ${zone("--k-flow", 16, 318, 780, 112, "学习流程", "提议确认或输入命令后进入", {id: "flow", view: "learn"})}
    ${zone("--k-loop", 16, 470, 780, 112, "状态库", "组装上下文时读取", {bottom: true})}
    ${zone("--k-turn", 812, 16, 212, 304, "观测")}
    ${zone("--k-tool", 500, 70, 172, 222, "工具循环", "", {sub: true, bottom: true})}

    ${flow("M736 80 L736 58 L92 58 L92 80", "e-reply-entry")}${label(414, 62, "回答经同一入口返回", "middle")}
    ${box("entry", 34, 80, 112, 48, "入口", chat)}
    ${flow("M146 104 L176 104", "e-entry-turn")}
    ${box("turn", 176, 80, 124, 48, "对话一轮", "traces")}
    ${flow("M300 104 L330 104", "e-turn-ctx")}

const FLOW_STEPS = ["assess", "teach", "quiz", "grade", "plan"];
// Which box a stage span or a model call belongs to; null for the chat itself.
function stageNode(name) {
  if (/^(assess|synthesize)/.test(name) || name === "gather") return "assess";
  if (name === "teach" || name.startsWith("clarify")) return "teach";
  if (name === "next_question" || name === "classify_turn") return "quiz";
  if (name.startsWith("grade")) return "grade";
  if (name === "chat_summary" || name === "conversation_title") return "chats";
  if (name === "plan") return "plan";
  return null;
}

// What one feed event lights and says: {nodes, edges, text, bad, wait}; nodes empty for list-only events.
function liveSpec(e) {
  const d = e.detail || {}, point = e.point ? `：${e.point}` : "", stage = STAGE[e.name] || e.name;
  switch (e.kind) {
    case "turn_start":
      return {nodes: ["entry", "turn"], edges: ["e-entry-turn"], text: e.name === "chat" ? "收到消息" : `命令 ${e.name}`};
    case "turn_end":
      return {nodes: ["reply", "trace", "chats"], edges: ["e-llm-reply", "e-reply-entry", "e-reply-trace"],
        text: e.status !== "ok" ? `本轮${STATUS[e.status] || e.status}` : `${e.name === "chat" ? "回答完成" : `${e.name} 结束`} · ${ms(d.duration_ms)}`,
        bad: e.status === "error"};
    case "flow_start":
      return {nodes: ["flow", "kp"], edges: ["e-turn-flow", "e-flow-kp"], text: `开始${FLOW[e.name] || e.name}${point}`};
    case "flow_end":
      return {nodes: ["flow", "kp", "schedule"], edges: ["e-flow-kp"], bad: e.status === "error",
        text: `${FLOW[e.name] || e.name}结束：${END[d.end_reason] || STATUS[e.status] || e.status}`};
    case "stage_start": {
      const node = stageNode(e.name);
      if (node === "chats") return {nodes: ["context", "chats"], edges: [], text: stage};
      return node ? {nodes: [node, "context"], edges: ["e-flow-steps"], text: stage + point} : {nodes: [], edges: [], text: stage};
    }
    case "loop_start":
      // The context is assembled right before the loop starts; the build itself is reported with its first call.
      return {nodes: ["context", "llm"], edges: ["e-turn-ctx", "e-ctx-llm"], text: `组装上下文，进入工具循环：${stage}`};
    case "context": {
      const node = stageNode(e.name), share = d.limit ? `约 ${Math.round(d.estimate / d.limit * 100)}%` : `约 ${num(d.estimate)}`;
      return {nodes: ["context", ...(FLOW_STEPS.includes(node) ? ["kp"] : ["memory", "chats"])], edges: [],
        text: `上下文预算：${stage} ${share}${d.summary ? " · 含摘要" : ""}`};
    }
    case "llm": {
      const node = stageNode(e.name), inFlow = FLOW_STEPS.includes(node);
      return {nodes: ["llm", ...(inFlow ? [node] : [])], edges: [inFlow ? "e-stage-llm" : "e-ctx-llm"], bad: e.status !== "ok",
        text: e.status === "ok" ? `模型回复：${stage} · 输入 ${num(d.tokens_in)} / 输出 ${num(d.tokens_out)} token · ${ms(d.latency_ms)}` : `模型调用失败：${stage}`};
    }
    case "approval_wait":
      return {nodes: ["approval"], edges: ["e-llm-approval"], text: `等待你批准：${d.title || e.name}`, wait: true};
    case "approval_done":
      return {nodes: ["approval"], edges: e.status === "approved" ? ["e-approval-tools"] : [], bad: e.status === "denied",
        text: `${(APPROVAL[e.status] || ["", e.status])[1]}：${e.name}`};
    case "tool": {
      const auto = d.approval_source === "policy" || d.approval_source === "turn";
      const nodes = ["tools", ...(auto ? ["approval"] : [])];
      if (e.name === "propose_memory" && e.status === "ok") nodes.push("memory");
      if (/^propose_(learn|review|resume)$/.test(e.name)) nodes.push("flow");
      return {nodes, edges: ["e-llm-approval", "e-approval-tools", "e-tools-llm"], bad: e.status !== "ok",
        text: e.status === "ok" ? `调用 ${e.name}（${TOOL_SOURCE[d.approval_source] || "无需确认"}）` : `${e.name} 没有执行：${e.status}`};
    }
    case "event": {
      const [nodes, edges, text] = EVENT_SPEC[e.name] || [[], [], EVENT_TEXT[e.name] || e.name];
      const more = e.name === "GuardrailTriggered" ? `：${RULE[d.rule] || d.rule || ""}`
        : e.name === "StateChanged" && d.to ? `：${e.point ? `${e.point} → ` : ""}${STATE_TEXT[d.to] || d.to}` : point;
      return {nodes, edges, text: text + more, bad: e.name === "GuardrailTriggered"};
    }
  }
  return {nodes: [], edges: [], text: e.kind};
}

// The feed's cursor, the events waiting to be played, ids already played, the open approvals.
const LV = {cursor: null, queue: [], playing: false, seen: new Set(), recent: [], waiting: new Set(), pending: 0, tick: 0, skipped: 0};
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");

function liveMount() {
  Object.assign(LV, {cursor: null, queue: [], playing: false, seen: new Set(), recent: [], waiting: new Set(), pending: 0, tick: 0, skipped: 0});
  $("#view").innerHTML = `<div class="archwrap" id="arch">${archSVG()}</div><div class="archstat" id="archstat"><span class="faint">运行时，经过的模块会依次亮起；正在运行的步骤保持高亮</span></div>
    <h2>最近事件</h2><div class="card livefeed" id="livefeed"><div class="empty">打开本页之后发生的事会按顺序出现在这里，图上对应的模块同时亮起。</div></div>
    <div id="livecards"></div>`;
}

// One class on some boxes or arrows for a moment; lighting again restarts the moment.
function liveFlash(selector, cls, duration) {
  document.querySelectorAll(selector).forEach((el) => {
    clearTimeout(el[`_${cls}`]);
    el.classList.add(cls);
    el[`_${cls}`] = setTimeout(() => el.classList.remove(cls), duration);
  });
}

function liveWaiting() {
  document.querySelector('#arch [data-node="approval"]')?.classList.toggle("wait", LV.waiting.size > 0 || LV.pending > 0);
}

function liveShow(e) {
  const spec = liveSpec(e);
  if (e.kind === "approval_wait") LV.waiting.add(e.id.split(":")[1]);
  if (e.kind === "approval_done") { LV.waiting.delete(e.id.split(":")[1]); LV.pending = Math.max(0, LV.pending - 1); }
  liveWaiting();
  if (!REDUCED.matches) {
    for (const node of spec.nodes) liveFlash(`#arch [data-node="${node}"]`, spec.bad ? "err" : "hot", 1000);
    for (const edge of spec.edges) liveFlash(`#arch [data-edge="${edge}"]`, "live", 1000);
  }
  const stat = $("#archstat");
  if (stat) stat.innerHTML = `<span class="dot live"></span><span${spec.bad ? ' class="warnc"' : ""}>${esc(spec.text)}</span>`
    + (LV.skipped ? `<span class="faint">（事件太多，跳过 ${num(LV.skipped)} 个）</span>` : "");
  LV.recent.unshift({e, spec});
  LV.recent.length = Math.min(LV.recent.length, 12);
  const list = $("#livefeed");
  if (list) list.innerHTML = LV.recent.map(({e, spec}) => `<div class="ev${spec.bad ? " bad" : ""}"><span class="t">${clock(e.at_ns).slice(-8)}</span>
    ${icon({llm: "llm", tool: "tool", event: "event", context: "stage", approval_wait: "guard", approval_done: "guard"}[e.kind] || (e.kind.startsWith("flow") ? "flow" : e.kind.startsWith("stage") ? "stage" : e.kind.startsWith("loop") ? "loop" : "turn"))}
    <span>${esc(spec.text)}</span>${e.trace_id ? `<a class="lnk" data-trace="${esc(e.trace_id)}">trace →</a>` : "<span></span>"}</div>`).join("");
}

// Plays the queue one event every 600 ms, so a turn's steps light up in order even when they took no time.
function livePlay() {
  const e = LV.queue.shift();
  if (!e || !$("#arch")) { LV.playing = false; return; }
  LV.playing = true;
  liveShow(e);
  setTimeout(livePlay, REDUCED.matches ? 0 : 600);
}

async function liveFeed() {
  LV.tick++;
  const stats = LV.tick % 7 === 1;  // the boxes' numbers about every ten seconds
  const d = await api(`/api/live/events?${LV.cursor == null ? "" : `after=${LV.cursor}&`}${stats ? "stats=1" : ""}`);
  if (d.stats) liveStats(d.stats);
  LV.cursor = d.next;
  LV.skipped += d.skipped;
  for (const e of d.events) {
    if (LV.seen.has(e.id)) continue;
    LV.seen.add(e.id);
    LV.queue.push(e);
  }
  if (LV.seen.size > 500) LV.seen = new Set([...LV.seen].slice(-300));
  if (LV.queue.length > 30) { LV.skipped += LV.queue.length - 30; LV.queue = LV.queue.slice(-30); }
  if (!LV.playing) livePlay();
}

// What stays lit: every running span's box, and at the deepest one the model or the tool it waits on.
function liveChain(running) {
  const on = new Set();
  for (const run of running) {
    for (const span of run.chain) {
      if (span.kind === "turn") { on.add("entry"); on.add("turn"); }
      else if (span.kind === "flow") on.add("flow");
      else if (span.kind === "stage" && stageNode(span.name)) on.add(stageNode(span.name));
      else if (span.kind === "loop") on.add("context");
    }
    const last = run.chain.at(-1);
    if (last.kind === "loop") on.add(last.progress?.tool ? "tools" : "llm");
    else if (last.kind === "stage") on.add("llm");
  }
  document.querySelectorAll("#arch [data-node]").forEach((node) => node.classList.toggle("on", on.has(node.dataset.node)));
}

async function viewTraces() {

    && (!q || `${spanLabel(t)} ${t.point || ""} ${t.trace_id}`.toLowerCase().includes(q)));

    <div class="card" style="padding:4px 8px">${items.length ? `<table><thead><tr><th>开始</th><th>内容</th><th>状态</th><th style="width:18%">耗时</th>

      items.map((t) => {
        const failed = failedOf(t);
        const badge = t.status === "ok" && failed ? pill("error", "有错误") : pill(t.status);
        return `<tr class="click" data-trace="${esc(t.trace_id)}"><td class="faint" style="white-space:nowrap">${clock(t.started_at_ns)}</td>
        <td>${icon(t.kind, "k-" + t.kind)} ${esc(spanLabel(t))}${t.end_reason ? ` <span class="faint">${esc(END[t.end_reason] || t.end_reason)}</span>` : ""}</td>
        <td>${badge}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="minibar" style="flex:1"><span class="${t.status === "running" ? "running" : failed ? "error" : ""}" style="width:${Math.max(2, (t.duration_ms || longest) / longest * 100)}%"></span></div><span class="faint mono">${ms(t.duration_ms)}</span></div></td>
        <td class="num">${num(t.llm_calls)}</td><td class="num">${num(t.tokens_in)} / ${num(t.tokens_out)}</td><td class="num">${money(t.cost)}</td><td class="num">${num(t.tool_calls)}</td></tr>`;
      }).join("") + "</tbody></table>" : `<div class="empty">没有符合条件的 trace。</div>`}</div>`;
  const input = $("#tq");
  input.addEventListener("input", (e) => { traceFilter.q = e.target.value; viewTraces().catch((err) => pulse(err.message)); });
  $("#ts").addEventListener("change", (e) => { traceFilter.status = e.target.value; viewTraces().catch((err) => pulse(err.message)); });
  if (keep) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function flatten(tree, nowNs) {
  const rows = [];
  function walk(node, depth) {
    const id = "s:" + node.span_id;
    const end = node.duration_ms == null ? nowNs : node.started_at_ns + node.duration_ms * 1e6;
    const leaf = (type, key, item, start, finish) => ({at: start, leaf: {type, id: key, node: item, start, end: finish}});
    const kids = [
      ...node.children.map((c) => ({at: c.started_at_ns, span: c})),
      ...node.llm_calls.map((c) => { const s0 = c.started_at_ns || node.started_at_ns; return leaf("llm", "l:" + c.id, c, s0, s0 + c.latency_ms * 1e6); }),
      ...node.tool_calls.map((c) => { const s0 = c.started_at_ns || node.started_at_ns; return leaf("tool", "t:" + c.id, c, s0, s0 + c.latency_ms * 1e6); }),
      ...node.events.filter((e) => e.type === "GuardrailTriggered" || (S.states && e.type === "StateChanged"))
        .map((e) => { const s0 = e.at_ns || node.started_at_ns; return leaf(e.type === "GuardrailTriggered" ? "guard" : "event", "e:" + e.id, e, s0, s0); }),
    ].sort((a, b) => a.at - b.at);
    rows.push({type: "span", id, node, start: node.started_at_ns, end, depth, kids: kids.length > 0});
    if (S.collapsed.has(id)) return;
    for (const k of kids) k.span ? walk(k.span, depth + 1) : rows.push({...k.leaf, depth: depth + 1, kids: false});
  }
  tree.roots.forEach((r) => walk(r, 0));
  return rows;
}

function rowName(r) {
  const n = r.node;
  if (r.type === "span") return {kind: n.kind, text: spanLabel(n), err: n.status === "error" || n.end_reason === "error"};
  if (r.type === "llm") return {kind: "llm", text: `${STAGE[n.stage] || n.stage || "模型"} · ${n.model}`, err: !!n.error_kind || n.status !== "ok"};
  if (r.type === "tool") return {kind: "tool", text: `${n.tool}${n.status !== "ok" ? " · " + n.status : ""}`, err: ["error", "timeout"].includes(n.status)};
  const p = n.payload || {};
  if (r.type === "guard") return {kind: "guard", text: `护栏 · ${RULE[p.rule] || p.rule}`, err: true};
  return {kind: "event", text: `${p.entity} ${p.from ?? "新建"} → ${p.to}`, err: false};
}

function renderTraceDetail() {
  const box = $("#tracebox");
  if (!S.trees || !box) return;
  let allRows = [];
  const html = S.trees.trees.map((tree) => {
    const rows = flatten(tree, S.trees.now_ns);
    allRows = allRows.concat(rows);
    const t0 = Math.min(...rows.map((r) => r.start));
    const t1 = Math.max(...rows.map((r) => r.end), t0 + 1e6);
    const total = t1 - t0;
    const body = rows.map((r) => {
      const nm = rowName(r);
      const left = (r.start - t0) / total * 100;
      const width = Math.max((r.end - r.start) / total * 100, 0.4);
      const running = r.type === "span" && r.node.status === "running";
      const mark = r.type === "event" || r.type === "guard"
        ? `<i class="${r.type === "guard" ? "bg-err" : "bg-flow"}" style="left:${left}%"></i>`
        : `<span class="bg-${nm.kind} ${nm.err ? "bg-err" : ""} ${running ? "bg-run" : ""}" style="left:${left}%;width:${width}%"></span>`;
      const dur = r.type === "span" ? ms(r.node.duration_ms) : r.type === "llm" || r.type === "tool" ? ms(r.node.latency_ms) : "";
      const tog = r.kids ? (S.collapsed.has(r.id) ? "▸" : "▾") : "";
      return `<div class="row ${r.id === S.selected ? "sel" : ""} ${nm.err ? "err" : ""}" data-node="${esc(r.id)}" data-kids="${r.kids ? 1 : 0}">
        <div class="name" style="padding-left:${r.depth * 14}px"><span class="tog">${tog}</span>${icon(nm.kind, "k-" + nm.kind)}<span class="t">${esc(nm.text)}</span></div>
        <div class="track">${mark}</div><div class="dur">${dur}</div></div>`;
    }).join("");
    const scale = [0, 0.5, 1].map((x) => `<span>${ms(Math.round(total * x / 1e6))}</span>`).join("");
    return `<div class="tree"><div class="axis"><div>${clock(t0)} · <label style="cursor:pointer"><input type="checkbox" data-states ${S.states ? "checked" : ""}> 显示状态迁移</label></div><div>${scale}</div><div></div></div>${body}</div>`;
  }).join("");
  if (!S.selected || !allRows.some((r) => r.id === S.selected)) {
    const firstErr = allRows.find((r) => r.type !== "span" && rowName(r).err);
    S.selected = (firstErr || allRows[0] || {}).id || null;
    if (S.selected) return renderTraceDetail();
  }
  box.innerHTML = `<div class="split"><div>${html}</div><div class="detail" id="nodedetail"></div></div>`;
  renderNode();
}

function findNode(id) {
  for (const tree of S.trees.trees) {
    const stack = [...tree.roots];
    while (stack.length) {
      const n = stack.pop();
      if ("s:" + n.span_id === id) return {type: "span", node: n};
      for (const c of n.llm_calls) if ("l:" + c.id === id) return {type: "llm", node: c};
      for (const c of n.tool_calls) if ("t:" + c.id === id) return {type: "tool", node: c};
      for (const e of n.events) if ("e:" + e.id === id) return {type: e.type === "GuardrailTriggered" ? "guard" : "event", node: e};
      stack.push(...n.children);
    }
  }
  return null;
}

const SKILL_SOURCE = {builtin: "内置", user: "用户"};
const SKILL_BY = {model: "由模型选择", user: "用户指定", fallback: "通用兜底"};

function skillChoice(a) {

const kv = (pairs) => `<dl class="kv">${pairs.filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;

      ${n.error_kind ? `<div class="errbox">错误：${esc(n.error_kind)}</div>` : ""}
      ${kv([["开始", clock(n.started_at_ns)], ["耗时", ms(n.duration_ms)], ["模型调用", num(t.llm_calls)], ["输入 token", `${num(t.tokens_in)}${t.tokens_cached ? `（缓存 ${num(t.tokens_cached)}）` : ""}`],
        ["输出 token", num(t.tokens_out)], ["花费", money(t.cost)], ["工具调用", num(t.tool_calls)], ["进度", esc(progressText(n.progress))],

    box.innerHTML = `<h3>${icon("tool", "k-tool")}工具 · ${esc(n.tool)}</h3>${pill(n.status === "ok" ? "ok" : n.status === "denied" ? "warn" : "error", n.status)}
      ${n.error_kind ? `<div class="errbox">${esc(n.error_kind)}</div>` : ""}
      ${kv([["权限", esc(n.permission)], ["耗时", ms(n.latency_ms)], ["轮次", n.round ? `第 ${n.round} 轮` : ""], ["审批", approvalLabel(n)],

      <div class="faint" style="font-size:11.5px">参数摘要</div><pre class="code">${esc(args || "—")}</pre>`;

  if (found.type === "event" || found.type === "guard") {

      ? `<h3>${icon("guard", "k-guard")}护栏 · ${esc(RULE[p.rule] || p.rule)}</h3>${pill("error", p.action)}<div class="errbox">${esc(p.reason || "")}</div>${kv([["规则", `<span class="mono">${esc(p.rule)}</span>`], ["工具", esc(p.tool || "")], ["阶段", esc(p.stage || "")], ["时间", clock(n.at_ns)]])}`
      : `<h3>${icon("event", "k-event")}状态迁移</h3>${kv([["对象", esc(p.entity)], ["从", esc(p.from ?? "新建")], ["到", `<b>${esc(p.to)}</b>`], ["原因", esc(p.cause)], ["时间", clock(n.at_ns)]])}`;

    ${pill(n.error_kind || n.status !== "ok" ? "error" : "ok", n.error_kind || n.status)}
    ${kv([["耗时", ms(n.latency_ms) + (n.ttft_ms != null ? `<span class="faint">（首字 ${ms(n.ttft_ms)}）</span>` : n.streamed === 0 ? '<span class="faint">（非流式）</span>' : "")], ["输入 token", `${num(n.tokens_in)}${n.tokens_cached ? `（缓存 ${num(n.tokens_cached)}）` : ""}`], ["输出 token", num(n.tokens_out)], ["花费", money(n.cost)]])}`;
  if (!cached) {

    api(`/api/llm/${encodeURIComponent(n.id)}`).then((data) => { S.llm[n.id] = data; if (S.selected === "l:" + n.id) renderNode(); })
      .catch((e) => { box.innerHTML = head + `<div class="errbox">${esc(e.message)}</div>`; });

  let extra = "";

    const sk = cached.build.skill;

      ["Skill", sk ? `<span class="mono">${esc(sk.name)} v${esc(sk.version)}（${esc(sk.sha)}）</span> · ${SKILL_SOURCE[sk.source] || esc(sk.source)}` : ""], ["构建状态", esc(cached.build.status)],
      ["纳入来源", num(cached.build.sources)], ["排除", num(cached.build.excluded)]]);
  }
  if (cached.failure) {
    extra += `<div class="errbox">${esc(cached.failure.error)}</div><div class="faint" style="font-size:11.5px">模型原文（已脱敏）</div><pre class="code">${esc(cached.failure.raw_output)}</pre>
      <div class="hint">沉淀为回归样例：</div><pre class="code">uv run zhiqiu failures export ${esc(cached.failure.id)} --to tests/regressions/NAME.json --expect rejected</pre>`;
  }
  if (cached.content) {
    const req = cached.content.request;
    const msgs = Array.isArray(req) ? req.map((m) => `<div class="msg"><div class="role">${esc(m.role)}${m.tool_call_id ? " · " + esc(m.tool_call_id) : ""}</div><pre class="code">${esc(typeof m.content === "string" ? m.content : JSON.stringify(m.content ?? m.tool_calls ?? "", null, 2))}</pre></div>`).join("")
      : `<pre class="code">${esc(req)}</pre>`;
    extra += `<details open><summary>回复</summary><pre class="code">${esc(cached.content.response || "（空）")}</pre></details><details><summary>请求消息（${Array.isArray(req) ? req.length : 1} 条）</summary>${msgs}</details>`;
  } else {
    extra += `<div class="hint">未保存提示与回复正文。需要时在 .env 设置 ZHIQIU_TRACE_CONTENT=1，之后的调用会记录（脱敏、截断，随 forget 删除）。</div>`;
  }
  if (cached.build && Object.keys(cached.build.budget || {}).length) {
    extra += `<details><summary>上下文预算</summary><pre class="code">${esc(JSON.stringify(cached.build.budget, null, 2))}</pre></details>`;
  }
  box.innerHTML = head + extra;
}

function hasError(data) {
  const stack = data.trees.flatMap((tree) => tree.roots);
  while (stack.length) {
    const n = stack.pop();
    if (n.status === "error" || n.llm_calls.some((c) => c.error_kind || c.status !== "ok")) return true;
    stack.push(...n.children);
  }
  return false;
}

async function viewTrace(id, refresh) {
  const data = await api(`/api/trace/${encodeURIComponent(id)}`);
  if (!refresh) { S.selected = null; S.collapsed = new Set(); S.llm = {}; }
  S.trees = data;
  const first = data.trees[0];
  const root = first.roots[0] || {};
  const t = root.totals || {};
  const running = data.trees.some((tr) => tr.roots.some((r) => r.status === "running"));
  setHead(spanLabel(root), `trace ${first.trace_id}${data.trees.length > 1 ? ` 等 ${data.trees.length} 条` : ""}`, `<a class="lnk" onclick="go('#traces')">← 返回列表</a>`);
  if (!refresh || !$("#tracebox")) $("#view").innerHTML = `<div id="tracetiles"></div><h2>调用树</h2><div id="tracebox"></div>`;
  const failed = root.end_reason === "error" || root.status === "error" || hasError(data);

    ["耗时", ms(root.duration_ms)], ["模型调用", num(t.llm_calls)], ["输入 / 缓存", `${num(t.tokens_in)}<span class="faint" style="font-size:12px"> / ${num(t.tokens_cached)}</span>`],
    ["输出 token", num(t.tokens_out)], ["花费", money(t.cost, first.currency)]]);
  renderTraceDetail();
  return running;
}

function dailyChart(daily) {
  const days = Object.entries(daily);
  if (!days.length) return `<div class="empty">没有模型调用。</div>`;
  const W = 640, H = 170, pad = 30, gap = 6;
  const max = Math.max(...days.map(([, d]) => d.tokens_in + d.tokens_out), 1);
  const bw = Math.min(46, (W - pad) / days.length - gap);
  const bars = days.map(([day, d], i) => {
    const x = pad + i * (bw + gap);
    const sc = (v) => v / max * (H - 34);
    let y = H - 18;
    const parts = [[d.tokens_cached, "var(--k-loop)", "缓存命中"], [d.tokens_in - d.tokens_cached, "var(--k-llm)", "输入"], [d.tokens_out, "var(--k-tool)", "输出"]]
      .map(([v, c, l]) => { const h = sc(v); y -= h; return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 0)}" rx="2" fill="${c}"><title>${day} ${l} ${num(v)}</title></rect>`; }).join("");
    return parts + `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${day.slice(5)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="每日 token"><text x="0" y="10">${num(max)}</text>
    <line x1="${pad}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line2)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--k-loop)"></i>缓存命中输入</span><span><i style="background:var(--k-llm)"></i>其余输入</span><span><i style="background:var(--k-tool)"></i>输出</span></div>`;
}

function hbars(entries, labeler = (k) => k) {
  const rows = Object.entries(entries || {});
  if (!rows.length) return `<div class="empty">无</div>`;
  const max = Math.max(...rows.map(([, v]) => v), 1);
  return rows.sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="hbar"><span>${esc(labeler(k))}</span><div class="b"><span style="width:${v / max * 100}%"></span></div><span style="text-align:right">${num(v)}</span></div>`).join("");
}

      ["提议", esc(Object.entries(d.human.proposals).map(([k, v]) => `${k} ${v}`).join("，") || "无")], ["人工改分", num(d.human.review_revisions)], ["评分延期", num(d.grading.deferred)]])}</div></div>

}

// Study plans (all time, not the range above): how they end, punctuality, and estimates against real time.
function planMetrics(p) {
  if (!p || !Object.keys(p.by_state || {}).length) return "";
  const states = Object.entries(p.by_state).map(([k, v]) => `${(PLAN_STATE[k] || ["", k])[1]} ${v}`).join("，");
  return `<div><h2>学习计划</h2><div class="card">${kv([["计划", esc(states)], ["完成率", pct(p.completion_rate)],
    ["学完的知识点", num(p.units_done)], ["准时率", pct(p.on_time_rate)], ["平均延期", p.average_delay_days == null ? "—" : `${p.average_delay_days} 天`],
    ["实际 ÷ 估计用时", p.estimate_ratio == null ? "—" : `×${p.estimate_ratio}`], ["自动重排", `${num(p.reschedules)} 次（复习日 ${num(p.review_day_moves)} 次）`]])}</div></div>`;
}

async function planAct(button) {
  const [id, action] = button.dataset.planAct.split(":");
  if (action === "abandon" && !confirm("放弃这份计划？已经学过的知识点和复习都会保留。")) return;
  button.disabled = true;
  try {
    await post("/api/plans/action", {plan_id: id, action});
    if (action === "open") { location.hash = "chat"; return; }
    await viewPlans();
  } catch (e) {
    const node = $("#planerr");
    if (node) node.textContent = e.message;
    button.disabled = false;
  }
}

function approvalAnswer(a, prompt) {
  if (a.status !== "pending") return "";
  const cell = (html) => `<tr class="apanswer"><td></td><td colspan="6">${html}</td></tr>`;
  if (!prompt) return cell(`<span class="faint">${WB.on ? "在发起的界面回答（终端里发起，或者已经没有程序在等）" : "在工作台中可以直接批准"}</span>`);
  return cell(`<pre class="code" style="white-space:pre-wrap;margin:4px 0 8px">${esc(prompt.full_text)}</pre>
    <div class="acts" style="display:flex;gap:8px;margin-bottom:6px"><button class="btn primary" data-approve="${esc(prompt.request_id)}" data-value="true">批准</button>
    <button class="btn" data-approve="${esc(prompt.request_id)}" data-value="false">拒绝</button></div>`);
}

async function approvalRespond(button) {
  document.querySelectorAll(`[data-approve="${CSS.escape(button.dataset.approve)}"]`).forEach((b) => { b.disabled = true; });
  try {
    await post("/api/chat/respond", {request_id: button.dataset.approve, value: button.dataset.value === "true", origin: "approvals"});
  } catch (e) {
    $("#apperr").textContent = /已经回答|已停止/.test(e.message) ? "已经在别处回答或已停止。" : `没有回答成功：${e.message}`;

  await viewApprovals().catch((e) => pulse(e.message));
}

// The schedule's own state: which view, the date it is anchored on and the month day opened below the grid.
const SCH = {view: "week", date: "", open: ""};
const WEEKDAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function isoAdd(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
}

function relDay(iso, today) {
  const diff = Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  return {0: "今天", 1: "明天", 2: "后天", "-1": "昨天"}[diff] || (diff > 0 ? `${diff} 天后` : `${-diff} 天前`);
}

function schItem(item) {
  const meta = [item.last_total == null ? "" : `上次 ${item.last_total} 分`, item.rule].filter(Boolean).join(" · ");
  const late = item.deferrals ? `<div class="m">原定 ${esc(item.original_due_date.slice(5))}，推迟 ${num(item.deferrals)} 次</div>` : "";
  const started = item.state === "started" ? ` ${pill("running", "进行中")}` : "";
  // Only due items start a review, and only in the workbench (the read-only dashboard has no chat).
  const go = item.due && WB.on;
  const tip = !item.due ? `${item.date.slice(5)} 到期，到期后才能复习` : WB.on ? "在对话里开始复习" : "在工作台中可以直接开始复习";
  return `<div class="sitem${go ? " go" : ""}" ${go ? `data-review="${esc(item.title)}"` : ""} title="${esc(tip)}">
    <b>${esc(item.title)}${started}</b><div class="m">${esc(meta)}</div>${late}</div>`;
}

function schDone(done) {
  return done.length ? `<div class="sdone">完成 ${num(done.length)} 次：${done.map((x) => esc(x.title) + (x.total == null ? "" : ` ${x.total} 分`)).join("、")}</div>` : "";
}

function schForecast(d) {
  const top = Math.max(d.limit + 1, d.backlog, ...d.forecast.map((f) => f.count));
  const bar = (count, cls, label, title, today) => `<div class="col${today ? " today" : ""}" title="${esc(title)}">
      <span class="v">${count || ""}</span><div class="bar ${count ? cls : "zero"}" style="height:${Math.round(count / top * 60)}px"></div>
      <span class="lbl">${esc(label)}</span></div>`;
  return `<div class="fc">${bar(d.backlog, "late", "逾期", `逾期 ${d.backlog} 个`, false)}` +
    d.forecast.map((f) => bar(f.count, f.over_limit ? "over" : "", f.date.slice(8),
      `${f.date}（${relDay(f.date, d.today)}）：${f.count} 个${f.over_limit ? `，超过每日上限 ${d.limit} 次` : ""}`, f.date === d.today)).join("") +
    `</div><div class="hint">未来 14 天的复习负载。只统计每个知识点已排定的下一次复习；每天最多 ${num(d.limit)} 次，超出的会顺延到之后几天。今天已开始 ${num(d.done_today)} 次。</div>`;
}

async function viewSchedule() {
  const d = await api(`/api/schedule?view=${SCH.view}${SCH.date ? `&date=${SCH.date}` : ""}`);
  SCH.date = d.anchor;
  const s = d.summary;
  setHead("复习日程", `${d.start.slice(5)} 至 ${d.end.slice(5)}`);
  const step = SCH.view === "week" ? "周" : "月";
  const label = SCH.view === "week" ? `${d.start.slice(5)} – ${d.end.slice(5)}` : `${d.anchor.slice(0, 4)} 年 ${Number(d.anchor.slice(5, 7))} 月`;
  let body = "";
  if (SCH.view === "week") {
    body = `<div class="week">${d.days.map((day, i) => {
      const cls = day.date === d.today ? " today" : day.date < d.today ? " past" : "";
      const rel = day.date >= d.today && day.date <= isoAdd(d.today, 2) ? `<span class="rel">${relDay(day.date, d.today)}</span>` : "";
      return `<div class="sday${cls}"><h5><span>${WEEKDAYS[i]}</span><span>${esc(day.date.slice(5))}</span>${rel}</h5>${day.items.map(schItem).join("")}${schDone(day.done)}</div>`;
    }).join("")}</div>`;
  } else {
    const month = d.anchor.slice(0, 7);
    body = `<div class="month">${WEEKDAYS.map((w) => `<div class="wd">${w}</div>`).join("")}${d.days.map((day) => {
      const cls = [day.date.slice(0, 7) !== month ? "out" : "", day.date === d.today ? "today" : "", day.date < d.today ? "past" : "", day.date === SCH.open ? "sel" : ""].filter(Boolean).join(" ");
      const over = day.items.length > d.limit;
      const count = day.items.length ? `<span class="c${over ? " over" : ""}">${day.items.length}</span>` : day.done.length ? `<span class="faint">完成 ${day.done.length}</span>` : "";
      const titles = day.items.slice(0, 2).map((item) => `<div class="t">${esc(item.title)}</div>`).join("") + (day.items.length > 2 ? `<div class="t">+${day.items.length - 2}</div>` : "");
      return `<div class="mcell ${cls}" data-day="${esc(day.date)}"><div class="d"><span>${Number(day.date.slice(8))}</span>${count}</div>${titles}</div>`;
    }).join("")}</div>`;
    const open = d.days.find((day) => day.date === SCH.open);
    if (open) body += `<div class="card" style="margin-top:10px"><h5 style="margin-bottom:6px">${esc(open.date)}（${relDay(open.date, d.today)}）</h5>${open.items.map(schItem).join("") || (open.done.length ? "" : `<div class="faint">这天没有复习安排。</div>`)}${schDone(open.done)}</div>`;
  }
  $("#view").innerHTML = tiles([["逾期", num(s.overdue)], ["今天", num(s.today)], ["未来 7 天", num(s.next7)], ["需要重学", num(s.relearn)]]) +
    `<div class="sch-bar" style="margin-top:14px"><span class="seg"><button data-sch="week" class="${SCH.view === "week" ? "on" : ""}">周</button><button data-sch="month" class="${SCH.view === "month" ? "on" : ""}">月</button></span>
      <button class="btn" data-sch="prev">上一${step}</button><span class="range">${esc(label)}</span><button class="btn" data-sch="next">下一${step}</button><button class="btn" data-sch="today">回到今天</button></div>
    <div class="sch-note" id="schnote"></div>` +
    (d.overdue.length ? `<div class="sday overdue" style="margin-bottom:10px;min-height:0"><h5>逾期 ${num(d.overdue.length)} 个</h5>${d.overdue.map(schItem).join("")}</div>` : "") +
    body + `<h2>负载预测</h2>` + schForecast(d) +
    (d.relearn.length ? `<h2>需要重学</h2><div class="card">${d.relearn.map((t) => `<div>${esc(t)} <span class="faint">· 先用 /learn 重学，之后才会排复习</span></div>`).join("")}</div>` : "");
}

function schNav(action) {
  const anchor = SCH.date || new Date().toISOString().slice(0, 10);
  if (action === "week" || action === "month") { SCH.view = action; SCH.open = ""; }
  else if (action === "today") { SCH.date = ""; SCH.open = ""; }
  else {
    const sign = action === "next" ? 1 : -1;
    if (SCH.view === "week") SCH.date = isoAdd(anchor, 7 * sign);
    else { const [y, m] = anchor.split("-").map(Number); SCH.date = new Date(Date.UTC(y, m - 1 + sign, 1)).toISOString().slice(0, 10); }
    SCH.open = "";
  }
  route();
}

async function schReview(title) {
  try {
    await post("/api/chat/input", {text: `/review ${title}`});
    // From the chat's own calendar the review starts where the user already is.
    if (S.view === "chat") await chatTick(true);
    else go("#chat");
  } catch (e) {
    if (S.view === "chat") { chatNote(/上一轮/.test(e.message) ? "上一轮还没结束，先回答或停止当前提示。" : `没有开始复习：${e.message}`, true); return; }
    const note = $("#schnote");
    if (note) note.textContent = /上一轮/.test(e.message) ? "上一轮还没结束，先回到对话回答或停止当前提示。" : `没有开始复习：${e.message}`;
  }
}

// ----- the workbench's root settings: only this page (with the token) changes them, never the agent -----
const ROOTS = {preview: {}, msg: {}};
const ROOT_NAME = {read: "可读目录", write: "可写目录"};

function rootRows(kind, items) {
  if (!items.length) return `<div class="faint" style="padding:6px 0">还没有${ROOT_NAME[kind]}。</div>`;
  return items.map((r) => {
    const src = r.source === "env" ? `<span class="src" title="在 .env 中修改">环境变量</span>`
      : `<span class="src wb">工作台添加 · ${esc((r.added_at || "").slice(5, 10))}</span>`;
    const count = r.files == null ? "" : `添加时 ${r.truncated ? "至少 " : ""}${num(r.files)} 个文本文件`;
    const gone = r.exists ? "" : `<span style="color:var(--bad)">目录不存在</span>`;
    const remove = r.source === "workbench" ? `<button class="btn danger" data-root-remove="${esc(kind)}" data-path="${esc(r.path)}">移除</button>` : "";
    return `<div class="rrow"><div class="rp">${esc(r.path)}</div>${remove}<div class="rm">${src}${[count, gone].filter(Boolean).join(" · ")}</div></div>`;
  }).join("");
}

function rootPreview(kind) {
  const p = ROOTS.preview[kind];
  if (!p) return "";
  const resolved = p.path !== p.input ? `<div class="faint">已解析为 <span class="mono">${esc(p.path)}</span></div>` : "";
  const samples = p.samples.length ? `<div class="faint">例如：${p.samples.map(esc).join("、")}</div>` : "";
  return `<div class="pv"><div class="mono">${esc(p.path)}</div>${resolved}<div style="margin-top:4px">${esc(p.notice)}</div>${samples}
    ${p.warnings.map((w) => `<div class="w">${esc(w)}</div>`).join("")}
    <div class="acts"><button class="btn primary" data-root-add="${esc(kind)}">确认添加</button><button class="btn" data-root-cancel="${esc(kind)}">取消</button></div></div>`;
}

async function viewRoots() {
  const d = await api("/api/roots");
  setHead("目录白名单", "知秋在对话中能读、能写的目录", d.busy || d.pending ? pill("running", "本轮进行中") : "");
  const section = (kind, intro) => `<div class="card roots" id="roots-${kind}"><h4 style="margin-bottom:4px">${ROOT_NAME[kind]}</h4><div class="faint" style="font-size:12px;margin-bottom:6px">${intro}</div>
    <div class="rlist">${rootRows(kind, d[kind])}</div>
    <div class="addline"><input id="root-in-${kind}" placeholder="粘贴绝对路径，例如 D:\\notes\\算法" autocomplete="off" spellcheck="false"><button class="btn" data-root-preview="${kind}">预览</button></div>
    <div class="pvbox">${rootPreview(kind)}</div><div class="err">${esc(ROOTS.msg[kind] || "")}</div></div>`;
  $("#view").innerHTML = section("read", "对话中知秋可以读取这些目录里的笔记、代码等文本文件，读到的内容会发送到模型端点。") +
    section("write", "知秋可以在这些目录里新建或覆盖 .md/.txt 笔记。每次写入仍需你批准；审批策略不能把写文件设为自动。") +
    `<div class="hint">改动在两轮对话之间生效，不用重启。环境变量（ZHIQIU_READ_ROOTS / ZHIQIU_WRITE_ROOTS）里的目录只能在 .env 中修改。每次改动都记一条审计事件（只记路径和文件数）。知秋自己没有任何办法改动这份名单。工作台最多添加 ${num(d.limits.max)} 个可读目录和 ${num(d.limits.max)} 个可写目录。</div>`;
}

function rootMsg(kind, text) {
  ROOTS.msg[kind] = text;
  const node = document.querySelector(`#roots-${kind} .err`);
  if (node) node.textContent = text;
}

// A preview belongs to the path it was made for: editing the path drops it.
document.addEventListener("input", (event) => {
  const kind = event.target.id?.startsWith("root-in-") && event.target.id.slice(8);
  if (kind && ROOTS.preview[kind]) {
    ROOTS.preview[kind] = null;
    document.querySelector(`#roots-${kind} .pvbox`).innerHTML = "";
  }
});

async function rootsAction(button) {
  const kind = button.dataset.rootPreview || button.dataset.rootAdd || button.dataset.rootCancel || button.dataset.rootRemove;
  rootMsg(kind, "");
  if (button.dataset.rootCancel) { ROOTS.preview[kind] = null; document.querySelector(`#roots-${kind} .pvbox`).innerHTML = ""; return; }
  button.disabled = true;
  try {
    if (button.dataset.rootPreview) {
      const path = $(`#root-in-${kind}`).value;
      ROOTS.preview[kind] = await post("/api/roots/preview", {kind, path});
      document.querySelector(`#roots-${kind} .pvbox`).innerHTML = rootPreview(kind);
      return;
    }
    let path, before;
    if (button.dataset.rootAdd) {
      await post("/api/roots/add", {kind, path: ROOTS.preview[kind].input});
      path = ROOTS.preview[kind].path;
      ROOTS.preview[kind] = null;
      before = false;
    } else {
      path = button.dataset.path;
      if (!confirm(`移除后，知秋不能再${kind === "read" ? "读取" : "写入"}这个目录；已经读进对话的内容不受影响。\n\n${path}`)) return;
      await post("/api/roots/remove", {kind, path});
      before = true;
    }
    // The worker applies it between turns; wait briefly until the list shows the change.
    for (let i = 0; i < 20; i++) {
      await new Promise((r) => setTimeout(r, 250));
      const d = await api("/api/roots");
      if (d[kind].some((r) => r.source === "workbench" && r.path === path) !== before || i === 19) break;
    }
    await viewRoots();
    if (button.dataset.rootAdd) $(`#root-in-${kind}`).value = "";
  } catch (e) {
    rootMsg(kind, e.message);
  } finally {
    button.disabled = false;
  }
}
