// Markdown for the model's answers. Everything is escaped first; only these few constructs then become
// tags, built from already-escaped text, so no HTML from an answer can run. Links show their address as text.
// Looks like a file path (has a folder separator and an extension): opened in the file pane when clicked.
const FILEISH = /^(?:[A-Za-z]:)?[^\s:*?"<>|]*[\\/][^\s:*?"<>|]*\.[A-Za-z0-9]{1,8}$/;
// Absolute Windows paths with an extension inside a line of plain text (tool notes).
const ABSPATH = /[A-Za-z]:\\[^\s，。；：、（）()"'<>]+\.[A-Za-z0-9]{1,8}/g;
const linkPaths = (escaped) => escaped.replace(ABSPATH, (p) => `<a class="lnk fp" data-fopen="${p}" title="在右侧打开">${p}</a>`);

function md(source) {
  const inline = (s) => s.replace(/`([^`]+)`/g, (m, c) => FILEISH.test(c) ? `<code class="fp" data-fopen="${c}" title="在右侧打开">${c}</code>` : `<code>${c}</code>`).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "$1（$2）");
  const cells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const lines = esc(source).split("\n");
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      out.push(`<pre class="code"><code>${code.join("\n")}</code></pre>`);
    } else if (/^#{1,4}\s/.test(line)) {
      flush();
      const level = line.match(/^#+/)[0].length;
      out.push(`<div class="h h${level}">${inline(line.replace(/^#+\s*/, ""))}</div>`);
    } else if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flush();
      const head = cells(line);
      const rows = [];
      for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(cells(lines[i]));
      i--;
      out.push(`<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table>");
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      i--;
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (!line.trim()) {
      flush();
    } else {
      para.push(line);
    }
  }
  flush();
  return `<div class="md">${out.join("")}</div>`;
}

// Chat state: the last event seen, the prompt cards by request id, what is waiting now, the conversation
// whose history is on screen and the sidebar's list.
// live: null while the SSE stream is used, "fallback" while polling; dirty: events arrived since the
// panel and the sidebar were last read.
const C = {mounted: false, after: 0, cards: {}, ask: null, busy: false, pending: [], tick: 0, sending: false,
  loaded: null, convs: [], renaming: null, live: null, streaming: false, dirty: false, liveText: null, compacting: false,
  // The panel's review calendar: the month shown ("" = this month), the day opened, the last schedule read.
  cal: {date: "", open: "", data: null}};

function chatMount() {
  setHead("对话", "加载中…");
  const narrow = matchMedia("(max-width: 860px)").matches;
  $("#view").innerHTML = `<div class="chatgrid"><details class="convs" id="convs"${narrow ? "" : " open"}><summary>会话</summary>
      <div class="offnote" id="convsoff" hidden>先回答或停止当前提示</div>
      <div class="cbody"><div class="cnew"><button class="btn primary new" id="newchat">新对话</button><button class="btn" id="newgroup" title="新建分组">＋分组</button></div>
      <div id="clist"><div class="faint">加载中…</div></div></div></details>
    <div class="chatmain"><div class="stream" id="stream"></div>
    <div class="composer"><div class="box"><div class="askbar" id="askbar" hidden></div>
      <textarea id="say" rows="1" placeholder="和知秋说点什么（/help 查看命令，Shift+Enter 换行）"></textarea>
      <div class="line"><button class="btn modelbtn" id="modelbtn" aria-haspopup="true" aria-expanded="false" title="切换模型">模型 ▾</button>
        <div class="modelmenu" id="modelmenu" hidden></div><div class="state" id="cstate"></div>
        <button class="btn mic" id="mic" hidden title="按住说话，松开结束（本地识别，录音不保存）" aria-label="按住说话">${icon("mic")}</button>
        <button class="btn" id="stop" disabled title="停止正在等待的提问或审批">停止</button><button class="btn primary" id="send">发送</button></div></div>
      <div class="vhint" id="vhint" hidden></div></div></div>
    <details class="spanel" id="spanel"${narrow ? "" : " open"}><summary>复习计划、状态与文件</summary><div class="pdrag" id="pdrag" title="拖动调整宽度"></div>
      <div class="ptabs" id="ptabs"></div>
      <div id="pstatus"><section class="cal" id="spcal"><div class="faint">复习计划加载中…</div></section><div id="spbody"><div class="faint">加载中…</div></div></div>
      <div class="pfile" id="pfile" hidden></div></details></div>`;
  chatFitHead();
  chatUnmount();
  Object.assign(C, {mounted: true, after: 0, cards: {}, ask: null, busy: false, pending: [], loaded: null, convs: [], renaming: null,
    dirty: true, progress: null, compacting: false});
  $("#newchat").addEventListener("click", () => chatControl("/api/chat/new", {}));
  $("#newgroup").addEventListener("click", () => groupInput());
  $("#clist").addEventListener("dragstart", (e) => {
    const row = e.target.closest(".crow[data-conv]");
    if (row) { e.dataTransfer.setData("text/zq-conv", row.dataset.conv); e.dataTransfer.effectAllowed = "move"; }
  });
  $("#clist").addEventListener("dragover", (e) => {
    const zone = e.target.closest("[data-gdrop]");
    if (zone && e.dataTransfer.types.includes("text/zq-conv")) { e.preventDefault(); zone.classList.add("drop"); }
  });
  $("#clist").addEventListener("dragleave", (e) => e.target.closest("[data-gdrop]")?.classList.remove("drop"));
  $("#clist").addEventListener("drop", (e) => {
    const zone = e.target.closest("[data-gdrop]");
    const id = e.dataTransfer.getData("text/zq-conv");
    if (!zone || !id) return;
    e.preventDefault();
    zone.classList.remove("drop");
    convOrganize("/api/chat/move", {conversation_id: id, group_id: zone.dataset.gdrop || null});
  });
  $("#clist").addEventListener("toggle", (e) => {
    const group = e.target.closest?.("details[data-group]");
    if (!group) return;
    GROUPS_OPEN[group.dataset.group] = group.open;
    try { localStorage.setItem("zq.groups", JSON.stringify(GROUPS_OPEN)); } catch (err) { /* not kept */ }
  }, true);
  $("#clist").addEventListener("click", (e) => {
    const gact = e.target.closest("[data-gnew],[data-gmenu]");
    if (gact) {
      e.preventDefault();
      e.stopPropagation();
      if (gact.dataset.gnew !== undefined) chatControl("/api/chat/new_in", {group_id: gact.dataset.gnew});
      else groupMenu(gact);
      return;
    }
    const rename = e.target.closest("[data-rename]");
    if (rename) { e.stopPropagation(); convMenu(rename); return; }
    const row = e.target.closest(".crow[data-conv]");
    if (row && !row.classList.contains("on") && !e.target.closest("input")) chatControl("/api/chat/switch", {conversation_id: row.dataset.conv});
  });
  $("#say").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); chatSend(); } });
  $("#send").addEventListener("click", chatSend);
  $("#modelbtn").addEventListener("click", (e) => { e.stopPropagation(); modelToggle(); });
  $("#pdrag").addEventListener("pointerdown", paneDrag);
  paneRender();
  $("#modelmenu").addEventListener("click", (e) => { e.stopPropagation(); modelClick(e); });
  modelLoad().catch((e) => pulse(e.message));
  $("#mic").addEventListener("pointerdown", micStart);
  for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) $("#mic").addEventListener(name, micStop);
  $("#mic").hidden = !V.available;
  $("#say").addEventListener("input", () => { if (!$("#say").value.trim()) voiceReset(); sayFit(); });
  $("#stop").addEventListener("click", async () => { try { await post("/api/chat/stop", {}); chatTick(true); } catch (e) { chatNote(e.message, true); } });
}

// The chat column is at least as tall as the window below the page head, so the composer stays at the bottom.
function chatFitHead() {
  const head = $(".pagehead");
  if (head) main.style.setProperty("--headh", `${head.offsetHeight + parseFloat(getComputedStyle(head).marginBottom)}px`);
}
window.addEventListener("resize", () => { if (S.view === "chat") chatFitHead(); });

// The input grows with its text up to its max-height, then scrolls.
function sayFit() {
  const box = $("#say");

// A study plan card: the dated units, the pace, and what the user may do with the draft (PRD 10.0 §5.3).

  const warn = (t) => `<div class="warn">${esc(t)}</div>`;

  const lines = [c.summary ? `<div class="sum">${esc(c.summary)}</div>` : "",

    c.suggest_web && c.suggest_web_reason ? `<div class="sum">建议联网参考：${esc(c.suggest_web_reason)}</div>` : "",
    c.late_days ? warn(`按当前节奏会比截止日 ${c.deadline} 晚 ${c.late_days} 天`) : "",

  const pace = `<div class="pace"><span class="seg">${seg}</span>
    <label>每天 <input type="number" min="1" max="3" data-plan-field="new_per_day" value="${p.new_per_day}"> 个</label>
    <label><input type="number" min="15" max="180" step="5" data-plan-field="daily_minutes" value="${p.daily_minutes}"> 分钟</label>
    <label>开始 <input type="date" data-plan-field="start_date" value="${esc(p.start_date || "")}"></label>
    <label>截止 <input type="date" data-plan-field="deadline" value="${esc(c.deadline || "")}"></label>
    <button class="btn" data-respond="${id}" data-plan-pace="1">改节奏</button></div>`;
  const reviews = [...(c.review_days || [])].sort(), shown = new Set();
  const rows = [];

    const ops = !u.editable ? "" : skip ? `<button ${pv("unknown:" + u.key)}>恢复</button>`

      <td>${esc(u.title)}${u.goal ? `<div class="goal">${esc(u.goal)}</div>` : ""}${u.requires.length ? `<div class="goal req">先学：${esc(u.requires.join("、"))}</div>` : ""}</td>

}

function promptCard(e) {
  if (e.kind === "grant") return grantCard(e);
  if (e.kind === "plan") return planCard(e);
  const buttons = (yes, no) => `<div class="acts"><button class="btn primary" data-respond="${esc(e.request_id)}" data-value="true">${yes}</button>
    <button class="btn danger" data-respond="${esc(e.request_id)}" data-value="false">${no}</button></div>`;
  if (e.kind === "approval") {
    return `<div class="acard" data-card="${esc(e.request_id)}"><div class="head">${icon("guard", "k-guard")}需要你批准：<span class="mono">${esc(e.tool)}</span>${pill("warn", e.permission)}</div>
      <pre class="code">${esc(e.text)}</pre>${buttons("批准", "拒绝")}</div>`;
  }
  if (e.kind === "confirm") {
    return `<div class="acard ask" data-card="${esc(e.request_id)}"><div class="head">${esc(e.text)}</div>${buttons("是", "否")}</div>`;
  }

function resolveCard(e) {
  const card = document.querySelector(`[data-card="${CSS.escape(e.request_id)}"]`);
  const kind = card ? (card.dataset.grant ? "grant" : card.dataset.plan ? "plan" : card.classList.contains("acard") ? (card.querySelector(".k-guard") ? "approval" : "confirm") : "ask") : null;
  const stopped = {stopped: "已停止", timeout: "超时未回答，已停止"}[e.reason];
  if (card && kind === "plan" && !stopped && !(e.value in PLAN_DONE)) {
    // An edit or a message about the plan: the revised card follows, so the old one goes.
    card.remove();
    if (typeof e.value === "string" && e.value.startsWith("say:")) chatAppend(`<div class="bubble user">${esc(e.value.slice(4))}</div>`);
    if (C.ask === e.request_id) C.ask = null;
    return;
  }
  if (card && kind !== "ask") {
    card.classList.add("done");
    card.querySelector(".acts")?.remove();
    card.querySelector("[data-grant-root]")?.setAttribute("disabled", "");
    const where = e.origin === "approvals" ? "审批页" : "网页";
    const granted = typeof e.value === "string" ? (e.value === "once" ? "只允许这一次" : e.value.startsWith("root:") ? `已加入白名单：${e.value.slice(5)}` : "已拒绝") : "";
    card.querySelectorAll("button,input").forEach((b) => { b.disabled = true; });
    const label = stopped || (kind === "plan" ? PLAN_DONE[e.value] : kind === "grant" ? granted : kind === "approval" ? (e.value ? `已批准（${where}）` : `已拒绝（${where}）`) : (e.value ? "是" : "否"));
    card.insertAdjacentHTML("beforeend", `<div class="result">${esc(label)} · ${clock(e.at_ns)}</div>`);
  } else if (stopped) {
    chatNote(stopped);
  } else if (typeof e.value === "string") {
    chatAppend(`<div class="bubble user">${esc(e.value)}${e.input_source === "voice" ? VOICE_MARK : ""}</div>`);
  }
  if (C.ask === e.request_id) C.ask = null;
}

// ----- lesson diagrams: a flow chart, a tree or a concept map, drawn as plain SVG ------------------------
// Layered layout: break cycles by reversing back edges, longest-path layers, two barycenter sweeps.
const DG = {n: 0};
function dgTextWidth(text) {
  let w = 0;
  for (const ch of text) w += /[⺀-￿]/.test(ch) ? 13 : 7.2;
  return w;
}
function dgLayout(d) {
  const ids = d.nodes.map((n) => n.id), at = Object.fromEntries(ids.map((id, i) => [id, i]));
  const out = ids.map(() => []), indeg = ids.map(() => 0);
  d.edges.forEach((e, k) => { out[at[e.from]].push([at[e.to], k]); indeg[at[e.to]]++; });
  const state = ids.map(() => 0), back = new Set();
  const dfs = (u) => { state[u] = 1; for (const [v, k] of out[u]) { if (state[v] === 1) back.add(k); else if (!state[v]) dfs(v); } state[u] = 2; };
  ids.forEach((_, i) => { if (!indeg[i] && !state[i]) dfs(i); });
  ids.forEach((_, i) => { if (!state[i]) dfs(i); });
  const dag = d.edges.map((e, k) => back.has(k) ? [at[e.to], at[e.from]] : [at[e.from], at[e.to]]);
  const succ = ids.map(() => []), pred = ids.map(() => []), inc = ids.map(() => 0), layer = ids.map(() => 0);
  dag.forEach(([a, b]) => { succ[a].push(b); pred[b].push(a); inc[b]++; });
  const queue = ids.map((_, i) => i).filter((i) => !inc[i]);
  while (queue.length) {
    const u = queue.shift();
    for (const v of succ[u]) { layer[v] = Math.max(layer[v], layer[u] + 1); if (--inc[v] === 0) queue.push(v); }
  }
  const layers = [];
  ids.forEach((_, i) => (layers[layer[i]] ||= []).push(i));
  const pos = ids.map(() => 0);
  layers.forEach((row) => row.forEach((n, j) => { pos[n] = j; }));
  const sweep = (rows, near) => rows.forEach((row) => {
    const bc = (n) => near[n].length ? near[n].reduce((s, m) => s + pos[m], 0) / near[n].length : pos[n];
    row.sort((a, b) => bc(a) - bc(b) || a - b);
    row.forEach((n, j) => { pos[n] = j; });
  });
  for (let round = 0; round < 2; round++) { sweep(layers.slice(1), pred); sweep(layers.slice(0, -1).reverse(), succ); }
  return {layers, back, layer};
}
function drawDiagram(d) {
  const id = `dg${++DG.n}`, lay = dgLayout(d);
  const W = d.nodes.map((n) => Math.min(200, Math.max(56, dgTextWidth(n.label) + 22))), H = 30;
  const wide = lay.layers.length > 4 && lay.layers.some((row) => row.length >= 4);
  const pad = 14, box = d.nodes.map(() => ({x: 0, y: 0}));
  let width = 0, height = 0;
  if (!wide) {
    const rowW = lay.layers.map((row) => row.reduce((s, n) => s + W[n], 0) + (row.length - 1) * 26);
    width = Math.max(...rowW) + pad * 2;
    lay.layers.forEach((row, li) => {
      let x = pad + (width - pad * 2 - rowW[li]) / 2;
      row.forEach((n) => { box[n] = {x, y: pad + li * (H + 48)}; x += W[n] + 26; });
    });
    height = pad * 2 + lay.layers.length * H + (lay.layers.length - 1) * 48;
  } else {
    const colW = lay.layers.map((row) => Math.max(...row.map((n) => W[n])));
    const colH = lay.layers.map((row) => row.length * H + (row.length - 1) * 16);
    height = Math.max(...colH) + pad * 2;
    let x = pad;
    lay.layers.forEach((row, li) => {
      let y = pad + (height - pad * 2 - colH[li]) / 2;
      row.forEach((n) => { box[n] = {x: x + (colW[li] - W[n]) / 2, y}; y += H + 16; });
      x += colW[li] + 64;
    });
    width = x - 64 + pad;
  }
  const at = Object.fromEntries(d.nodes.map((n, i) => [n.id, i]));
  const center = (i) => ({x: box[i].x + W[i] / 2, y: box[i].y + H / 2});
  const clip = (i, dx, dy) => {
    const t = Math.min(dx ? (W[i] / 2) / Math.abs(dx) : Infinity, dy ? (H / 2) / Math.abs(dy) : Infinity);
    return {x: center(i).x + dx * t, y: center(i).y + dy * t};

    // Back edges and edges inside one layer bend to the side so they do not cross the boxes between.

      mid = {x: (s.x + t.x) / 2, y: (s.y + t.y) / 2};
    } else {
      const len = Math.hypot(dx, dy) || 1, off = 46 + len * 0.15;
      const nx = -dy / len, ny = dx / len;
      const cx = (ca.x + cb.x) / 2 + nx * off, cy = (ca.y + cb.y) / 2 + ny * off;
      const s = clip(a, cx - ca.x, cy - ca.y), t = clip(b, cx - cb.x, cy - cb.y);
      path = `M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${t.x.toFixed(1)},${t.y.toFixed(1)}`;
      mid = {x: (s.x + 2 * cx + t.x) / 4, y: (s.y + 2 * cy + t.y) / 4};
      width = Math.max(width, cx + pad); height = Math.max(height, cy + pad);
    }
    const label = e.label ? `<text class="el" x="${mid.x.toFixed(1)}" y="${(mid.y + 4).toFixed(1)}" text-anchor="middle">${esc(e.label)}</text>` : "";
    return `<path class="eg${lay.back.has(k) ? " back" : ""}" d="${path}"${arrows ? ` marker-end="url(#${id}a)"` : ""}/>${label}`;
  }).join("");
  const nodes = d.nodes.map((n, i) => `<g class="nd"><rect x="${box[i].x.toFixed(1)}" y="${box[i].y.toFixed(1)}" width="${W[i].toFixed(1)}" height="${H}" rx="8"/>
    <text x="${center(i).x.toFixed(1)}" y="${(center(i).y + 4.5).toFixed(1)}" text-anchor="middle">${esc(n.label)}</text></g>`).join("");
  return `<svg class="dgsvg" viewBox="0 0 ${Math.ceil(width)} ${Math.ceil(height)}" width="${Math.ceil(width)}" height="${Math.ceil(height)}" role="img" aria-label="${esc(d.title)}">
    <defs><marker id="${id}a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
    ${edges}${nodes}</svg>`;
}
const DG_KIND = {flow: "流程图", tree: "树", map: "概念图"};
function diagramFigure(d, text) {
  return `<figure class="dg"><div class="dgscroll">${drawDiagram(d)}</div>
    <figcaption><span>${esc(DG_KIND[d.type] || "")} · ${esc(d.title)}</span><button class="lnk" data-dgtext>文字版</button></figcaption>

  view.setUint32(24, 16000, true); view.setUint32(28, 32000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, "data"); view.setUint32(40, samples.length * 2, true);
  samples.forEach((value, i) => { const s = Math.max(-1, Math.min(1, value)); view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); });
  return new Blob([buffer], {type: "audio/wav"});
}
async function micStart(event) {
  if (V.rec) return;
  if (!V.available) { event.preventDefault(); voiceOffer(); return; }
  event.preventDefault();
  const mic = $("#mic");
  mic.setPointerCapture?.(event.pointerId);
  const rec = V.rec = {chunks: [], started: performance.now(), level: 0, stop: null, released: false};
  mic.classList.add("rec");
  voiceHint(`<span class="dot live"></span>正在录音 0.0 秒，松开结束`);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}});
    let ctx;
    try { ctx = new AudioContext({sampleRate: 16000}); } catch (e) { ctx = new AudioContext(); }
    await ctx.audioWorklet.addModule("/voice-worklet.js");
    const source = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, "zhiqiu-recorder");
    const mute = ctx.createGain();
    mute.gain.value = 0;  // pulled through the graph, never played back
    node.port.onmessage = (m) => { rec.chunks.push(m.data); rec.level = Math.max(...m.data.map(Math.abs)); };
    source.connect(node); node.connect(mute); mute.connect(ctx.destination);
    rec.stop = () => { source.disconnect(); node.disconnect(); stream.getTracks().forEach((t) => t.stop()); ctx.close(); };
    rec.timer = setInterval(() => {
      const seconds = (performance.now() - rec.started) / 1000;
      voiceHint(`<span class="dot live"></span>正在录音 ${seconds.toFixed(1)} 秒，松开结束<span class="vlevel"><i style="width:${Math.min(100, rec.level * 160).toFixed(0)}%"></i></span>`);
      if (seconds >= V.max) micStop();
    }, 150);
    if (rec.released) micStop();
  } catch (err) {
    V.rec = null;
    mic.classList.remove("rec");
    voiceHint(err && err.name === "NotAllowedError" ? "浏览器没有麦克风权限" : `无法录音：${esc(err.message || err)}`, true);
  }
}
async function micStop() {
  const rec = V.rec;
  if (!rec) return;
  if (!rec.stop) { rec.released = true; return; }  // let go before the microphone was ready
  V.rec = null;
  clearInterval(rec.timer);
  rec.stop();
  $("#mic").classList.remove("rec");
  const total = rec.chunks.reduce((n, c) => n + c.length, 0);
  if (total < 16000 * 0.3) { voiceHint("按住说话，松开结束"); return; }
  const samples = new Float32Array(total);
  let at = 0;
  for (const chunk of rec.chunks) { samples.set(chunk, at); at += chunk.length; }
  voiceHint("识别中…");
  try {
    const response = await fetch("/api/chat/transcribe", {method: "POST", cache: "no-store", body: encodeWav(samples),
      headers: {"Content-Type": "audio/wav", "X-Zhiqiu-Token": WB.token}});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(response.status === 409 ? "上一段还在识别" : data.error || response.statusText);
    voiceInsert(data);
  } catch (err) {
    voiceHint(esc(err.message), true);
  }
}
// The transcript goes where the cursor is; what was typed stays.
function voiceInsert(data) {
  const box = $("#say");
  if (!data.text) { voiceHint("没有听清，再说一次"); return; }
  const start = box.selectionStart ?? box.value.length, end = box.selectionEnd ?? start;
  box.value = box.value.slice(0, start) + data.text + box.value.slice(end);
  box.selectionStart = box.selectionEnd = start + data.text.length;
  box.focus();
  sayFit();
  Object.assign(V, {voiced: true, voiceId: data.voice_id, seg: {start, text: data.text, raw: data.raw, changes: data.replacements.map((r) => ({...r, undone: false}))}});
  voiceHints();
}
function voiceHints() {
  const seg = V.seg;
  if (!seg) return voiceHint("");
  const live = seg.changes.filter((c) => !c.undone);
  voiceHint(live.length
    ? `已按术语修正：${seg.changes.map((c, i) => c.undone ? "" : `<span class="vfix">${esc(c.from)}→${esc(c.to)}<button class="lnk" data-vundo="${i}">撤销</button></span>`).join("")}<button class="lnk" data-vraw>用原始转写</button>`
    : `语音转写已填入，确认后再发送`);
}
// Swap the transcript in the box for a new version, if the user has not edited that part since.
function voiceReplace(next) {
  const box = $("#say"), seg = V.seg;
  let at = box.value.substr(seg.start, seg.text.length) === seg.text ? seg.start : box.value.indexOf(seg.text);
  if (at < 0) { voiceHint("文字已经改过，不能再撤销", true); return false; }
  box.value = box.value.slice(0, at) + next + box.value.slice(at + seg.text.length);
  seg.start = at;
  seg.text = next;
  sayFit();
  return true;
}
function voiceUndo(button) {
  const seg = V.seg;
  if (!seg) return;
  if (button.dataset.vraw !== undefined) {
    if (voiceReplace(seg.raw)) { seg.changes.forEach((c) => { c.undone = true; }); voiceHints(); }
    return;
  }
  const change = seg.changes[Number(button.dataset.vundo)];
  const next = seg.text.slice(0, change.at) + change.from + seg.text.slice(change.at + change.to.length);
  if (seg.text.substr(change.at, change.to.length) === change.to && voiceReplace(next)) { change.undone = true; voiceHints(); }
}

// The section of a bot bubble showing a streamed answer while it arrives (created on its first piece).
function draftNode(id, create) {
  let node = [...document.querySelectorAll("#stream .draft")].find((n) => n.dataset.stream === id) || null;
  if (!node && create) {
    const last = $("#stream")?.lastElementChild;
    const html = `<div class="draft" data-stream="${esc(id)}"></div>`;
    if (last && last.matches(".bubble.bot:not(.old)")) {
      last.insertAdjacentHTML("beforeend", html);
      node = last.lastElementChild;
    } else node = chatAppend(`<div class="bubble bot">${html}</div>`)?.firstElementChild || null;
  }
  return node;
}

function chatDraft(e) {
  const node = draftNode(e.stream_id, e.kind === "delta");
  if (!node) return;
  if (e.kind === "stream_reset") {
    // The round went on to call tools: its text was not the answer.
    const bubble = node.parentElement;
    node.remove();
    if (bubble && !bubble.children.length) bubble.remove();
    return;
  }
  const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
  node.dataset.raw = (node.dataset.raw || "") + e.text;
  node.innerHTML = md(node.dataset.raw);
  if (nearBottom) main.scrollTop = main.scrollHeight;
}

function chatEvent(e) {
  // A switch, a finished turn or new prices: the model button reads again.
  if (e.kind === "prices" || e.kind === "idle") modelLoad().catch(() => {});
  // A stage's reply is still arriving; anything said or asked next means it is done.
  if (e.kind === "progress") { C.progress = e; chatProgress(); return; }
  if (e.kind in {say: 1, ask: 1, confirm: 1, approval: 1, grant: 1, plan: 1, idle: 1, error: 1} && C.progress) { C.progress = null; chatProgress(); }
  if (e.kind === "delta" || e.kind === "stream_reset") { chatDraft(e); return; }
  if (e.kind === "user") chatAppend(`<div class="bubble user">${esc(e.text)}${e.input_source === "voice" ? VOICE_MARK : ""}</div>`);
  else if (e.kind === "say" && e.stream_id && draftNode(e.stream_id, false)) {
    // The streamed answer is complete: what was said replaces the draft, word for word as stored.
    const node = draftNode(e.stream_id, false);
    node.classList.remove("draft");
    delete node.dataset.stream;
    delete node.dataset.raw;
    node.innerHTML = md(e.text);
  } else if (e.kind === "say") {
    // Tool call notes and system notes are small print; everything else is the agent talking.
    if (e.say_kind === "tool") chatAppend(`<div class="note">${icon("tool", "k-tool")}<span>${linkPaths(esc(e.text))}</span></div>`);
    else if (e.say_kind === "note") chatNote(e.text);
    else if (e.say_kind === "outcome") chatAppend(outcomeCard(e));
    else {
      // Lines said one after another (a lesson, a grading report) belong in one bubble.
      const last = $("#stream")?.lastElementChild;
      const diagram = e.meta?.diagram;
      let html;
      try { html = diagram ? sectionHtml(e.text, diagram, e.meta.diagram_text) : md(e.text); }
      catch (err) { html = md(e.text) + (e.meta?.diagram_text ? `<pre class="code">${esc(e.meta.diagram_text)}</pre>` : ""); }
      if (last && last.matches(".bubble.bot:not(.old)")) {
        const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
        last.insertAdjacentHTML("beforeend", html);
        if (nearBottom) main.scrollTop = main.scrollHeight;
      } else chatAppend(`<div class="bubble bot">${html}</div>`);
      // A picture wider than the bubble starts centred (its first layer usually holds one node).
      if (diagram) document.querySelectorAll(".dgscroll:not([data-centred])").forEach((box) => {
        box.scrollLeft = (box.scrollWidth - box.clientWidth) / 2;
        box.dataset.centred = "1";
      });
    }
  } else if (e.kind in {ask: 1, confirm: 1, approval: 1, grant: 1, plan: 1}) {
    chatAppend(promptCard(e));
    if (e.kind === "ask") C.ask = e.request_id;
  } else if (e.kind === "resolved") resolveCard(e);
  else if (e.kind === "voice_install") voiceInstallEvent(e);
  else if (e.kind === "reminder") reminderEvent(e);
  else if (e.kind === "status") chatNote(e.text);
  else if (e.kind === "error") chatNote(e.text, true);
}

// A grading summary: its first line is the total, then one line per dimension (indented tips under it);
// the last line points the terminal to /detail, which the card replaces with a button.
function outcomeCard(e) {
  const lines = e.text.split("\n").filter((line) => !line.startsWith("输入 /detail"));
  const head = lines.shift() || "";
  const body = lines.map((line) => /^\s{4}/.test(line) ? `<div class="tip">${esc(line.trim())}</div>` : `<div class="dim">${esc(line.trim())}</div>`).join("");
  const id = e.meta?.attempt_id;
  return `<div class="ocard"><div class="head">${esc(head)}</div>${body}
    ${id ? `<div class="acts" style="margin-top:8px"><button class="btn" data-detail="${esc(id)}">展开详情</button><a class="lnk" data-attempt="${esc(id)}" style="margin-left:8px">学习记录 →</a></div>` : ""}</div>`;
}

// The detail is read from the read-only attempt endpoint, so it opens even while the chat is busy.
async function outcomeDetail(button) {
  const card = button.closest(".ocard");
  const open = card.querySelector(".more");
  if (open) { open.remove(); button.textContent = "展开详情"; return; }
  button.disabled = true;
  try {
    const d = await api(`/api/attempt/${encodeURIComponent(button.dataset.detail)}`);
    const ev = {};
    d.review_evidence.forEach((x) => { (ev[x.dimension] ||= []).push(x); });
    const byQuestion = Object.fromEntries(d.questions.map((q) => [q.question_id, q]));
    const dims = d.dimension_scores.map((g) => `<div class="q"><b>${esc(DIM[g.dimension] || g.dimension)} ${g.score}/4</b>
      ${(ev[g.dimension] || []).map((x) => `<blockquote>${esc(x.quote)}</blockquote>`).join("")}
      <div>${esc(g.rationale)}</div>${g.supplement ? `<div class="hint">补充：${esc(g.supplement)}</div>` : ""}
      ${d.question_assessments.filter((a) => a.dimension === g.dimension).map((a) => {
        const q = byQuestion[a.question_id] || {};
        return `<div class="meta" style="margin-top:6px">原题（${esc(q.difficulty || "")}）</div><div>${esc(q.question || "")}</div>
          <div class="meta">原答</div><div class="ans">${q.answer ? esc(q.answer) : '<span class="faint">未回答</span>'}</div>
          ${q.scoring_text ? `<div class="meta">评分采用的最终答案</div><div class="ans">${esc(q.scoring_text)}</div>` : ""}`;
      }).join("")}</div>`).join("");
    card.insertAdjacentHTML("beforeend", `<div class="more">${dims || '<div class="faint">没有分维度评分。</div>'}</div>`);
    button.textContent = "收起详情";
  } catch (err) {
    chatNote(`读取评阅详情失败：${err.message}`, true);
  } finally {
    button.disabled = false;
  }
}

// Switching, starting and renaming are done by the worker between turns; the page only asks.
async function chatControl(path, body) {
  // Poll every second until the worker says it is idle again, however quickly it switched.
  try { await post(path, body); C.expect = true; } catch (e) { chatNote(e.message, true); }
  await chatTick(true).catch((e) => pulse(e.message));
}

// The worker opened another conversation (sidebar, "新对话" or a typed /new): show that one instead.
async function chatSwitched(e) {
  if (C.after === 0 && C.loaded === e.conversation_id) return;  // the history just loaded is this one
  $("#stream").innerHTML = "";
  Object.assign(C, {cards: {}, ask: null});
  await chatHistory().catch((err) => chatNote(`读取之前的消息失败：${err.message}`, true));
  await chatConvs().catch((err) => pulse(err.message));
}

function dayLabel(iso) {
  const today = new Date();
  const day = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if (iso === day(today)) return "今天";
  if (iso === day(new Date(today.getTime() - 86400000))) return "昨天";
  return (iso || "").slice(5);
}

async function chatConvs() {
  const d = await api("/api/chat/conversations");
  C.convs = d.conversations;
  const list = $("#clist");
  if (!list || C.renaming) return;
  C.groups = d.groups || [];
  const row = (c) => `<div class="crow${c.current ? " on" : ""}${c.archived ? " archived" : ""}" data-conv="${esc(c.id)}" title="${esc(c.title)}"${c.current ? "" : ` draggable="true"`}>
      <div class="ct">${esc(c.title)}</div><button class="rn" data-rename="${esc(c.id)}" title="改名、移到分组、归档">⋯</button>
      <div class="cm">${esc(dayLabel(c.chat_date))} · ${num(c.messages)} 条${c.resumable ? `<span class="tag">可继续</span>` : ""}</div></div>`;
  const live = d.conversations.filter((c) => !c.archived);
  const archived = d.conversations.filter((c) => c.archived);
  const section = (key, name, items, {group = null, closed = false, cls = ""} = {}) => {
    const open = GROUPS_OPEN[key] ?? !closed;
    const tools = group ? `<button data-gnew="${esc(group)}" title="在这个分组里开新对话">＋</button><button data-gmenu="${esc(group)}" title="改名或删除分组">⋯</button>` : "";
    return `<details class="cgroup ${cls}" data-group="${esc(key)}"${open ? " open" : ""}><summary${key !== "@archive" ? ` data-gdrop="${esc(group || "")}"` : ""}>
      <span class="gn">${esc(name)}</span><span class="gc">${num(items.length)}</span>${tools}</summary>${items.map(row).join("") || `<div class="faint" style="padding:4px 9px">拖对话到这里</div>`}</details>`;
  };
  const grouped = C.groups.map((g) => section(g.id, g.name, live.filter((c) => c.group_id === g.id), {group: g.id})).join("");
  const loose = live.filter((c) => !c.group_id);
  // Without any group the list looks as before: no headings at all.
  list.innerHTML = (C.groups.length ? grouped + (loose.length ? section("@none", "未分组", loose) : "") : loose.map(row).join(""))
    + (archived.length ? section("@archive", "已归档", archived, {closed: true, cls: "cgarch"}) : "")
    || `<div class="faint">还没有对话</div>`;
  chatHead();
}

function chatHead() {
  const current = C.convs.find((c) => c.current);
  setHead("对话", current ? current.title : "", C.pending.length ? pill("running", "等待你") : C.busy ? pill("running", "处理中") : pill("ok", "空闲"));
  $("#sub").title = current ? current.id : "";  // the full id only on hover
}

// Which group sections are open (by group id; "@none", "@archive"), remembered per browser.
let GROUPS_OPEN = {};
try { GROUPS_OPEN = JSON.parse(localStorage.getItem("zq.groups") || "{}"); } catch (e) { /* all open */ }

async function convOrganize(path, body) {
  try { await post(path, body); } catch (e) { chatNote(e.message, true); }
  await chatConvs().catch((e) => pulse(e.message));
}

function popMenu(anchor, html, onPick) {
  document.querySelector(".cmenu")?.remove();
  const menu = document.createElement("div");
  menu.className = "cmenu";
  menu.innerHTML = html;
  document.body.appendChild(menu);
  const box = anchor.getBoundingClientRect();
  menu.style.left = `${Math.min(box.left, window.innerWidth - menu.offsetWidth - 8)}px`;
  menu.style.top = `${Math.min(box.bottom + 4, window.innerHeight - menu.offsetHeight - 8)}px`;
  menu.addEventListener("click", (e) => {
    const pick = e.target.closest("button[data-pick]");
    if (!pick || pick.disabled) return;
    e.stopPropagation();
    menu.remove();
    onPick(pick.dataset.pick);
  });
  setTimeout(() => document.addEventListener("click", () => menu.remove(), {once: true}));
}

function convMenu(button) {
  const id = button.dataset.rename;
  const item = C.convs.find((c) => c.id === id);
  if (!item) return;
  const groups = (C.groups || []).map((g) => `<button data-pick="move:${esc(g.id)}"${item.group_id === g.id ? " disabled" : ""}>${esc(g.name)}${item.group_id === g.id ? " ✓" : ""}</button>`).join("");
  popMenu(button, `<button data-pick="rename">改名</button><div class="sep"></div><div class="lbl">移到分组</div>${groups}
    <button data-pick="move:"${item.group_id ? "" : " disabled"}>未分组${item.group_id ? "" : " ✓"}</button><button data-pick="newgroup">新建分组并移入…</button><div class="sep"></div>
    ${item.archived ? `<button data-pick="unarchive">取消归档</button>` : `<button data-pick="archive"${item.current ? " disabled title=\"不能归档当前对话\"" : ""}>归档</button>`}`,
  (pick) => {
    if (pick === "rename") convRename(id);
    else if (pick === "newgroup") groupInput(id);
    else if (pick.startsWith("move:")) convOrganize("/api/chat/move", {conversation_id: id, group_id: pick.slice(5) || null});
    else convOrganize("/api/chat/archive", {conversation_id: id, archived: pick === "archive"});
  });
}

function groupMenu(button) {
  const id = button.dataset.gmenu;
  const group = (C.groups || []).find((g) => g.id === id);
  if (!group) return;
  popMenu(button, `<button data-pick="rename">改名</button><button data-pick="delete">删除分组（对话移到未分组）</button>`, (pick) => {
    if (pick === "rename") groupInput(null, group);
    else convOrganize("/api/chat/groups/delete", {group_id: id});
  });
}

// An input at the top of the list: a new group (then moving a conversation into it), or a group's new name.
function groupInput(moveId = null, group = null) {
  const list = $("#clist");
  list.querySelector(".ginput")?.remove();
  list.insertAdjacentHTML("afterbegin", `<input class="ginput" maxlength="20" placeholder="${group ? "分组的新名字" : "新分组的名字"}，回车确定">`);
  const input = list.querySelector(".ginput");
  input.value = group ? group.name : "";
  input.focus();
  input.select();
  C.renaming = "@group";
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    C.renaming = null;
    const name = input.value.trim();
    input.remove();
    if (!save || !name || (group && name === group.name)) { await chatConvs().catch((e) => pulse(e.message)); return; }
    try {
      const r = await post(group ? "/api/chat/groups/rename" : "/api/chat/groups/create", group ? {group_id: group.id, name} : {name});
      if (moveId) await post("/api/chat/move", {conversation_id: moveId, group_id: r.group.id});
    } catch (e) { chatNote(e.message, true); }
    await chatConvs().catch((e) => pulse(e.message));
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); done(true); }
    else if (e.key === "Escape") done(false);
  });
  input.addEventListener("blur", () => done(false));
}

function convRename(id) {
  const row = document.querySelector(`.crow[data-conv="${CSS.escape(id)}"]`);
  const item = C.convs.find((c) => c.id === id);
  if (!row || !item) return;
  C.renaming = id;
  const title = row.querySelector(".ct");
  title.innerHTML = `<input maxlength="30" value="${esc(item.title)}">`;
  const input = title.querySelector("input");
  input.focus();
  input.select();
  const done = async (save) => {
    if (C.renaming !== id) return;
    C.renaming = null;
    const value = input.value.trim();
    if (save && value && value !== item.title) await chatControl("/api/chat/rename", {conversation_id: id, title: value});
    else await chatConvs().catch((e) => pulse(e.message));
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); done(true); }
    else if (e.key === "Escape") done(false);
  });
  input.addEventListener("blur", () => done(false));
}

async function chatHistory() {
  const h = await api("/api/chat/history");
  C.loaded = h.conversation_id;
  if (!h.messages.length) return;
  chatAppend(`<div class="divider">之前的消息</div>`);
  for (const m of h.messages) {
    if (m.role === "user") chatAppend(`<div class="bubble user old">${esc(m.content)}${m.input_source === "voice" ? VOICE_MARK : ""}</div>`);
    else if (m.kind === "chat") chatAppend(`<div class="bubble bot old">${md(m.content)}</div>`);
    else chatNote(m.content, m.kind === "error");
  }
  chatAppend(`<div class="divider">本次工作台</div>`);
}

try { Object.assign(PANE, JSON.parse(localStorage.getItem("zq.pane") || "{}"), {files: {}, list: null}); } catch (e) { /* defaults */ }

const baseName = (path) => path.split(/[\\/]/).filter(Boolean).pop() || path;

function paneRender() {
  const tabs = $("#ptabs");
  if (!tabs) return;
  const tab = (key, label, title, closable) => `<button class="pt${PANE.active === key ? " on" : ""}" data-ftab="${esc(key)}" title="${esc(title)}">
    <span>${esc(label)}</span>${closable ? `<span class="x" data-fclose="${esc(key)}" title="关闭">×</span>` : ""}</button>`;
  tabs.innerHTML = tab("", "状态", "复习计划与当前状态") + tab("@files", "文件", "浏览可读、可写目录") +
    PANE.tabs.map((path) => tab(path, baseName(path), path, true)).join("");
  const onFile = PANE.active !== "";
  $("#pstatus").hidden = onFile;
  $("#pfile").hidden = !onFile;
  const grid = $(".chatgrid");
  grid?.classList.toggle("wide", onFile);
  grid?.style.setProperty("--pw", `${PANE.wide}px`);
  if (PANE.active === "@files") paneList();
  else if (onFile) paneFile(PANE.active);
}

function paneShow(key) {
  PANE.active = key;
  paneSave();
  paneRender();
  if (key === "@files" && !PANE.list) paneBrowse(PANE.dir);
  else if (key && key !== "@files" && !PANE.files[key]) paneLoad(key);
}

function paneOpen(path) {
  $("#spanel").open = true;
  if (!PANE.tabs.includes(path)) {
    PANE.tabs.push(path);
    if (PANE.tabs.length > PANE_TABS) PANE.tabs = PANE.tabs.filter((p) => p !== PANE.active).slice(-PANE_TABS);
  }
  delete PANE.files[path];
  paneShow(path);
}

function paneClose(path) {
  PANE.tabs = PANE.tabs.filter((p) => p !== path);
  delete PANE.files[path];
  if (PANE.active === path) PANE.active = PANE.tabs.at(-1) || "";
  paneSave();
  paneRender();
}

async function paneLoad(path, force = false) {
  try {
    const d = await api(`/api/files/read?path=${encodeURIComponent(path)}`);
    const old = PANE.files[path];
    PANE.files[path] = d;
    // The tab keeps the name it was opened with; a relative path is shown resolved.
    if (PANE.active === path && (force || !old || old.mtime_ns !== d.mtime_ns || old.error)) paneFile(path);
  } catch (e) {
    PANE.files[path] = {error: e.message};
    if (PANE.active === path) paneFile(path);
  }
}

function paneFile(path) {
  const box = $("#pfile");
  const d = PANE.files[path];
  if (!d) { box.innerHTML = `<div class="faint">读取中…</div>`; paneLoad(path); return; }
  if (d.error) {
    box.innerHTML = `<div class="fhead"><span class="path">${esc(path)}</span></div><div class="fbody"><div class="warnc">${esc(d.error)}</div>
      <div class="faint" style="margin-top:6px">只能打开对话可读、可写目录里的文本文件。<a class="lnk" data-view="roots">管理目录 →</a></div></div>`;
    return;
  }
  const scroll = box.querySelector(".fbody")?.scrollTop || 0;
  const meta = `${(d.size / 1024).toFixed(d.size < 10240 ? 1 : 0)} KB · ${new Date(d.mtime_ns / 1e6).toLocaleString("zh-CN", {hour12: false})}${d.truncated ? " · 只显示前 1MB" : ""}`;
  const body = d.language === "markdown" ? `<div class="fbody md">${md(d.text)}</div>`
    : `<div class="fbody code">${d.text.split("\n").map((line, i) => `<span class="ln">${i + 1}</span>${esc(line)}`).join("\n")}</div>`;
  box.innerHTML = `<div class="fhead"><span class="path" title="${esc(d.path)}">${esc(d.path)}</span>
    <button class="btn" data-fcopy="${esc(d.path)}">复制路径</button><button class="btn" data-frefresh="${esc(path)}">刷新</button></div>
    <div class="faint" style="margin:-4px 0 6px">${esc(meta)}</div>${body}`;
  box.querySelector(".fbody").scrollTop = scroll;
}

async function paneBrowse(dir) {
  $("#spanel").open = true;
  PANE.dir = dir || "";
  if (PANE.active !== "@files") { PANE.active = "@files"; paneRender(); }
  paneSave();
  try { PANE.list = await api(`/api/files/list?dir=${encodeURIComponent(PANE.dir)}`); }
  catch (e) { PANE.list = {error: e.message, dir: PANE.dir, entries: []}; }
  paneList();
}

function paneList() {
  const box = $("#pfile");
  const d = PANE.list;
  if (!box) return;
  if (!d) { box.innerHTML = `<div class="faint">读取中…</div>`; paneBrowse(PANE.dir); return; }
  const up = d.dir ? `<button class="btn" data-fdir="${esc(d.parent || "")}">${d.parent ? "↑ 上一级" : "↑ 所有目录"}</button>` : "";
  const rows = d.entries.map((e) => e.kind === "file"
    ? `<button class="fe" data-fopen="${esc(e.path)}"${e.readable ? "" : " disabled title=\"不是可读的文本类型\""}>${icon("book")}<span class="nm">${esc(e.name)}</span><span class="faint">${(e.size / 1024).toFixed(1)} KB</span></button>`
    : `<button class="fe" data-fdir="${esc(e.path)}">${icon("flow")}<span class="nm">${esc(e.name)}${e.kind === "dir" ? "/" : ""}</span></button>`).join("");
  box.innerHTML = `<div class="fhead"><span class="path">${esc(d.dir || "可读、可写目录")}</span>${up}</div>
    <div class="fbody flist">${d.error ? `<div class="warnc">${esc(d.error)}</div>` : rows || `<div class="faint">${d.dir ? "空目录" : "还没有可读或可写目录。"}<a class="lnk" data-view="roots">管理目录 →</a></div>`}
    ${d.truncated ? `<div class="faint">只列出前 300 项</div>` : ""}</div>`;
}

// Drag the column's left edge to make it wider or narrower (kept per browser).
function paneDrag(e) {
  const grid = $(".chatgrid");
  if (!grid?.classList.contains("wide")) return;
  e.preventDefault();
  const handle = e.currentTarget;
  handle.classList.add("on");
  handle.setPointerCapture(e.pointerId);
  const right = grid.getBoundingClientRect().right;
  const move = (ev) => {
    PANE.wide = Math.round(Math.min(Math.max(right - ev.clientX, 280), window.innerWidth * 0.6));
    grid.style.setProperty("--pw", `${PANE.wide}px`);
  };
  const done = () => {
    handle.classList.remove("on");
    handle.removeEventListener("pointermove", move);
    handle.removeEventListener("pointerup", done);
    paneSave();
  };
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", done);
}

// ----- the model button: which model answers, what each one costs now, and the vendor's price page -----
const MODEL = {open: false, data: null};

const windowSize = (n) => n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1024)}K` : `${n}`;

function modelPrice(p) {
  if (!p) return "未定价";
  const c = p.currency || "";
  const n = p.now;
  return `${c}${n.input} / ${c}${n.output}` + (p.peak_now === true ? " · 高峰" : p.peak_now === false ? " · 平峰" : "");
}

async function modelLoad() {
  if (!$("#modelbtn")) return;
  MODEL.data = await api("/api/chat/models");
  const d = MODEL.data;
  const button = $("#modelbtn");
  if (!button) return;
  button.textContent = `${d.current || "模型"} ▾`;
  button.title = `当前模型：${d.current}（点此切换）`;
  if (MODEL.open) modelMenu();
}

function modelToggle(open = !MODEL.open) {
  MODEL.open = open;
  $("#modelmenu").hidden = !open;
  $("#modelbtn").setAttribute("aria-expanded", String(open));
  if (open) { modelMenu(); modelLoad().catch((e) => pulse(e.message)); }
}

function modelMenu() {
  const d = MODEL.data;
  const menu = $("#modelmenu");
  if (!menu || !d) return;
  const locked = d.busy || d.pending;
  const rows = d.choices.map((c) => {
    const p = c.price;
    const sub = [p ? `缓存命中 ${p.currency}${p.now.cached_input}` : "", p?.window ? `上下文 ${windowSize(p.window)}` : "",
      p ? (p.source === "价格页" ? `价格页 ${(p.fetched_at || "").slice(0, 10)}` : "手填价格") : "", c.default ? "默认" : ""].filter(Boolean).join(" · ");
    return `<button class="mi" data-model-pick="${esc(c.model)}"${c.current || locked ? " disabled" : ""}>
      <span class="ck">${c.current ? "✓" : ""}</span><span class="nm">${esc(c.model)}</span><span class="pr">${esc(modelPrice(p))}</span>
      ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</button>`;
  }).join("");
  const page = d.page;
  const updating = d.updating ? "正在读取价格页…" : d.error ? `上次更新失败：${d.error}` : page ? `价格来自 ${page.vendor || ""} 价格页，${(page.fetched_at || "").slice(0, 10)} 读取` : "还没有读过价格页";
  const canDefault = d.current && d.current !== d.default;
  menu.innerHTML = `<div class="mh">每百万 token 的输入 / 输出价 · 切换从下一轮起生效${locked ? "（这一轮结束后才能切换）" : ""}</div>${rows}
    <div class="mf"><span style="flex:1;min-width:0">${esc(updating)}</span>
      ${d.provider ? `<button class="btn" data-prices-update${d.updating ? " disabled" : ""} title="读一次 ${esc(d.provider)} 的价格页，由模型挑出价格（一次小调用）">更新价格</button>` : `<span>未知厂商：在 config.toml 的 [price] 里手填</span>`}
      ${canDefault ? `<button class="btn" data-model-default="${esc(d.current)}" title="写入 ${esc(d.default_source === ".env" ? ".env" : "config.toml")}，以后启动都用它">设为默认</button>` : ""}</div>`;
}

async function modelClick(e) {
  const pick = e.target.closest("[data-model-pick]");
  if (pick && !pick.disabled) { modelToggle(false); await chatControl("/api/chat/model", {model: pick.dataset.modelPick}); return; }
  const update = e.target.closest("[data-prices-update]");
  if (update) {
    update.disabled = true;
    try { await post("/api/prices/update", {}); } catch (err) { chatNote(err.message, true); }
    await modelLoad().catch(() => {});
    return;
  }
  const keep = e.target.closest("[data-model-default]");
  if (keep) {
    try {
      const r = await post("/api/chat/model/default", {model: keep.dataset.modelDefault});
      chatNote(`已把 ${r.model} 设为默认模型（写入 ${r.path}）。`);
    } catch (err) { chatNote(err.message, true); }
    await modelLoad().catch(() => {});
  }
}

document.addEventListener("click", () => { if (MODEL.open && $("#modelmenu")) modelToggle(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && MODEL.open && $("#modelmenu")) modelToggle(false); });

// The composer's buttons, the question bar and the placeholder follow C at once, without a request.
function chatControls() {
  if (!$("#stop")) return;
  $("#stop").disabled = !C.pending.length;
  $("#send").disabled = C.sending || (C.busy && !C.ask);
  const bar = $("#askbar");
  const prompt = C.ask && C.pending.find((p) => p.request_id === C.ask);
  bar.hidden = !prompt;
  bar.textContent = prompt ? `需要你回答：${prompt.prompt}` : "";
  $("#say").placeholder = prompt ? "在这里输入回答（Enter 发送）" : C.busy ? "知秋正在处理上一条…" : "和知秋说点什么（/help 查看命令，Shift+Enter 换行）";
}

async function chatState() {
  chatControls();
  const waiting = C.pending.length;
  let state = "";
  if (waiting) state = `<span class="dot live"></span>等待你${C.pending.some((p) => p.kind === "approval") ? "批准" : "回答"}`;
  else if (C.busy) {
    let step = "";
    try {
      const live = await api("/api/live");
      const run = live.running[0];
      if (run) step = run.chain.map(spanLabel).slice(-2).join(" › ") + (progressText(run.chain.at(-1).progress) ? ` · ${progressText(run.chain.at(-1).progress)}` : "");
    } catch (e) { /* the step is only a hint */ }
    state = C.compacting ? `<span class="dot live"></span>正在压缩对话…`
      : `<span class="dot live"></span>知秋正在思考…${step ? ` <span class="mono">${esc(step)}</span>` : ""}<span id="cprogress"></span>`;
  }
  $("#cstate").innerHTML = state;
  chatProgress();
}

const STAGE_NAMES = {teach: "讲解", next_question: "题目", grade: "评阅", grade_segment: "评阅", grade_extract: "评阅",
  grade_combine: "评阅", clarify: "解答", clarify_chunk: "解答", clarify_combine: "解答", assess: "评估",
  assess_chunk: "评估", assess_combine: "评估", synthesize: "资料整理", synthesize_batch: "资料整理",
  classify_turn: "判断", chat_summary: "对话摘要", conversation_title: "标题"};

// "正在生成讲解，已写约 820 字": how much of a stage's JSON reply has arrived (its content shows once checked).
function chatProgress() {
  const node = $("#cprogress");
  if (!node) return;
  const p = C.progress;
  node.textContent = p && C.busy ? ` · 正在生成${STAGE_NAMES[p.stage] || p.stage}，已写约 ${p.chars} 字` : "";
}

const MODE = {chat: "对话", lesson: "讲解", self_test: "自测", review: "复习", planning: "制定计划"};

const USAGE_PART = {rules: ["规则", "var(--k-turn)"], context: ["背景", "var(--k-stage)"], summary: ["摘要", "var(--k-loop)"],
  history: ["历史", "var(--k-llm)"]};

// How full the next request is: by the estimate against the input budget, or by message count when the
// window is not configured. The vertical line is where the next turn summarizes older messages by itself.
function usageBlock(u, idle) {
  if (!u) return `<div class="unote">上下文占用暂时算不出来</div>`;
  const tip = u.can_compact ? `把较早的消息并入摘要，最近 ${u.keep_recent} 条保留原文` : `未摘要的消息不超过 ${u.keep_recent} 条，还不需要压缩`;
  const button = `<button class="btn" data-compact${u.can_compact && idle ? "" : " disabled"} title="${esc(tip)}">压缩</button>`;
  let head, bar, note;
  if (u.limit) {
    const share = (v) => Math.min(100, v / u.limit * 100);
    head = `<b class="${u.estimate > u.trigger ? "warnc" : ""}">${Math.round(u.estimate / u.limit * 100)}%</b><span class="faint">约 ${num(u.estimate)} / ${num(u.limit)}</span>`;
    bar = `<div class="ubar"><div class="fill">${u.parts.map((p) => `<span style="width:${share(p.tokens)}%;background:${USAGE_PART[p.key][1]}" title="${esc(USAGE_PART[p.key][0])} 约 ${num(p.tokens)}"></span>`).join("")}</div>
      <i class="trig" style="left:${share(u.trigger)}%" title="超过这里，下一轮会自动压缩"></i></div>`;
    note = `${u.method === "utf8_bytes" ? "按字节粗估，偏保守" : "按服务端计数推算"}；超过竖线（${Math.round(share(u.trigger))}%）下一轮自动压缩`;
  } else {
    head = `<b>${num(u.messages)}</b><span class="faint">/ ${num(u.history_messages)} 条未摘要</span>`;
    bar = `<div class="ubar"><div class="fill"><span style="width:${Math.min(100, u.messages / u.history_messages * 100)}%;background:var(--k-llm)"></span></div></div>`;
    note = `未配置上下文窗口（ZHIQIU_LLM_WINDOW），按条数计：超过 ${num(u.history_messages)} 条下一轮自动压缩`;
  }
  const legend = `<div class="ulegend">${u.parts.filter((p) => p.tokens).map((p) => `<span><i style="background:${USAGE_PART[p.key][1]}"></i>${USAGE_PART[p.key][0]} ${num(p.tokens)}</span>`).join("")}</div>`;
  return `<div class="uhead">${head}${button}</div>${bar}${legend}<div class="unote">${note}；最近 ${num(u.keep_recent)} 条始终保留原文，工具声明不计入</div>`;
}

// Compacting runs on the worker like a switch; its result arrives as a note in the chat.
async function chatCompact(button) {
  button.disabled = true;
  try {
    await post("/api/chat/compact", {});
    Object.assign(C, {expect: true, compacting: true});
  } catch (e) {
    chatNote(`没有压缩：${e.message}`, true);
    button.disabled = false;
  }
  await chatTick(true).catch((e) => pulse(e.message));
}

const CAL_WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];

// The review calendar beside the chat: this month's open reviews by day, overdue ones and today's at a glance.
async function chatCalendar() {
  // A reminder being typed in is not redrawn away.
  if (!$("#spcal") || C.cal.form) return;
  C.cal.data = await api(`/api/schedule?view=month${C.cal.date ? `&date=${C.cal.date}` : ""}`);
  calRender();
}

function calRender() {
  const node = $("#spcal"), d = C.cal.data;
  if (!node || !d) return;
  const s = d.summary, month = d.anchor.slice(0, 7);
  const badge = (n, cls, label) => `<div class="cb${n ? ` ${cls}` : ""}"><b>${num(n)}</b>${label}</div>`;
  const nav = `<div class="cnav"><button data-cal="prev" aria-label="上个月">‹</button><span>${d.anchor.slice(0, 4)} 年 ${Number(d.anchor.slice(5, 7))} 月</span>
    ${month !== d.today.slice(0, 7) ? `<button data-cal="today">本月</button>` : ""}<button data-cal="next" aria-label="下个月">›</button></div>`;
  const cells = d.days.map((day) => {
    const count = day.items.length;
    const cls = ["cd", day.date.slice(0, 7) !== month ? "out" : "", day.date < d.today ? "past" : "", count ? "has" : "",
      day.date === d.today ? "today" : "", day.date === C.cal.open ? "sel" : ""].filter(Boolean).join(" ");
    const mark = count ? `<i class="${count > d.limit ? "over" : ""}">${count}</i>` : day.done.length ? `<i class="ok">✓</i>` : "";
    const reminders = day.reminders || [], plan = (day.plan || []).filter((p) => p.state !== "done");
    const tip = `${day.date}（${relDay(day.date, d.today)}）` + (count ? `：待复习 ${count} 个` : "") + (day.done.length ? `，完成 ${day.done.length} 次` : "")
      + (reminders.length ? `，提醒 ${reminders.length} 个` : "") + (plan.length ? `，计划新学 ${plan.length} 个` : "");
    return `<div class="${cls}" data-calday="${esc(day.date)}" title="${esc(tip)}">${Number(day.date.slice(8))}${mark}${reminders.length ? `<b class="rm"></b>` : ""}${plan.length ? `<b class="pl"></b>` : ""}</div>`;
  }).join("");
  let list;
  const open = C.cal.open && d.days.find((day) => day.date === C.cal.open);
  if (open) {
    list = `<h5>${esc(open.date.slice(5))}（${relDay(open.date, d.today)}）</h5>${open.items.map(schItem).join("")}${schDone(open.done)}`
      + (open.items.length || open.done.length ? "" : `<div class="faint">这天没有复习安排</div>`)
      + planList(open.plan || []) + remindList(open.reminders || [], open.date >= d.today ? open.date : "");
  } else {
    const today = d.days.find((day) => day.date === d.today);
    list = (d.overdue.length ? `<h5 class="bad">逾期 ${num(d.overdue.length)} 个</h5>${d.overdue.map(schItem).join("")}` : "")
      + `<h5>今天</h5>${today && today.items.length ? today.items.map(schItem).join("") : `<div class="faint">今天没有待复习的知识点</div>`}`
      + (today ? schDone(today.done) : "") + planList(today?.plan || []) + remindList(today?.reminders || [], d.today);
  }
  if (d.relearn.length) list += `<div class="faint" style="margin-top:6px">需要重学：${d.relearn.map(esc).join("、")}</div>`;
  node.innerHTML = `<h4>${icon("calendar")}复习计划<a class="lnk" data-view="schedule">完整日程 →</a></h4>
    <div class="cbadges">${badge(s.overdue, "bad", "逾期")}${badge(s.today, "hot", "今天")}${badge(s.next7, "", "未来 7 天")}${badge(s.reminders_today || 0, "warm", "今日提醒")}</div>
    ${nav}<div class="cgrid">${CAL_WEEKDAYS.map((w) => `<div class="wd">${w}</div>`).join("")}${cells}</div><div class="clist">${list}</div>`;
}

// Study plan units of a day in the calendar list.
function planList(items) {
  if (!items.length) return "";
  return `<h5>学习计划</h5>` + items.map((p) => `<div class="prow${p.state === "done" ? " done" : ""}"><span class="tg">${esc(p.plan)}</span>
    <span class="tt">${esc(p.title)} <span class="faint">${p.state === "learning" ? "学习中" : p.state === "done" ? "已学完" : `约 ${num(p.minutes)} 分钟`}</span></span></div>`).join("");
}

// ----- reminders: in the calendar, a small form to add one, and the card said when one is due -----
const REPEAT_TEXT = {none: "一次", daily: "每天", weekdays: "工作日", weekly: "每周"};

function remindList(items, day) {
  const rows = items.map((r) => `<div class="rrow"><span class="tm">${esc(r.time)}</span><span class="tt">${esc(r.title)}${r.repeat !== "none" ? ` <span class="faint">${REPEAT_TEXT[r.repeat]}</span>` : ""}</span>
    <button class="x" data-rcancel="${esc(r.id)}" title="${r.repeat !== "none" ? "取消这个重复提醒" : "取消提醒"}">×</button></div>`).join("");
  const form = C.cal.form && C.cal.form === day ? `<div class="rform"><input type="time" id="rtime" value="${esc(C.cal.formTime || "21:00")}">
      <select id="rrepeat">${Object.entries(REPEAT_TEXT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <input class="wide" id="rtitle" maxlength="60" placeholder="提醒做什么，例如：复习红黑树">
      <div class="acts"><button class="btn" data-rform="cancel">取消</button><button class="btn primary" data-rform="save">保存</button></div></div>` : "";
  return (rows || day ? `<h5>提醒</h5>${rows}` : "") + form
    + (day && C.cal.form !== day ? `<a class="lnk" data-rnew="${esc(day)}" style="font-size:12px">＋提醒</a>` : "");
}

async function remindAction(target) {
  if (target.dataset.rnew) {
    C.cal.form = target.dataset.rnew;
    calRender();
    $("#rtitle")?.focus();
    remindPermission();
    return;
  }
  if (target.dataset.rform === "cancel") { C.cal.form = ""; calRender(); return; }
  try {
    if (target.dataset.rform === "save") {
      const title = $("#rtitle").value.trim();
      if (!title) { $("#rtitle").focus(); return; }
      await post("/api/reminders/create", {title, at: `${C.cal.form} ${$("#rtime").value || "21:00"}`, repeat: $("#rrepeat").value});
      C.cal.form = "";
    } else if (target.dataset.rcancel) {
      await post("/api/reminders/cancel", {id: target.dataset.rcancel});
    } else if (target.dataset.rsnooze) {
      await post("/api/reminders/snooze", {id: target.dataset.rsnooze, minutes: 10});
      target.closest(".rcard")?.classList.add("done");
      target.closest(".acts").innerHTML = `<span class="faint">10 分钟后再提醒</span>`;
    } else if (target.dataset.rok) {
      target.closest(".rcard")?.classList.add("done");
      target.closest(".acts").innerHTML = `<span class="faint">已知道</span>`;
      return;
    }
    if (target.dataset.rcancel && target.closest(".rcard")) {
      target.closest(".rcard").classList.add("done");
      target.closest(".acts").innerHTML = `<span class="faint">已取消</span>`;
    }
  } catch (e) { chatNote(e.message, true); }
  await chatCalendar().catch((e) => pulse(e.message));
}

// Today's study plan in the status panel: what to learn, what is held back, how the plans stand.
function todayBlock(t) {
  const items = [...t.continuing.map((u) => [u, "继续"]), ...t.units.map((u) => [u, "新学"])];
  const rows = items.map(([u, verb]) => `<div class="li"><span class="dot${verb === "继续" ? " live" : ""}"></span><span>${verb}《${esc(u.title)}》 <span class="faint">约 ${num(u.minutes)} 分钟 · ${esc(u.plan)}</span></span></div>`).join("");
  const head = t.review_day && !t.units.length ? `<div>今天复习 ${num(t.reviews.length)} 项，是复习日</div>`
    : `<div>${t.reviews.length ? `复习 ${num(t.reviews.length)} 项 · ` : ""}约 ${num(t.minutes)} 分钟</div>`;
  const ahead = t.ahead ? `<div class="faint">今天的计划已完成；可以提前学《${esc(t.ahead.title)}》（输入 /today ahead）</div>`
    : !items.length && t.done_today.length ? `<div class="faint">今天的计划已完成</div>` : "";
  const blocked = t.blocked.map((u) => `<div class="faint">推迟《${esc(u.title)}》：${esc(u.reason || "")}</div>`).join("");
  const late = t.late.map((p) => `<div class="warnc">《${esc(p.title)}》会比截止日晚 ${num(p.days)} 天</div>`).join("");
  const plans = t.plans.map((p) => `<div class="li"><span>${esc(p.title)}</span><span class="minibar" style="flex:1;margin:0 6px"><span style="width:${p.total ? Math.round(100 * p.done / p.total) : 0}%"></span></span><span class="faint">${num(p.done)}/${num(p.total)}</span></div>`).join("");
  return head + rows + ahead + blocked + late + `<div style="margin-top:6px">${plans}</div>` +
    (items.length ? `<div class="faint" style="margin-top:4px">输入 /today start 开始</div>` : "");
}

// Events arrive on the SSE stream (/api/chat/stream) as they happen. This tick, once a second, only
// refreshes what is read from the database (the running step, the status panel, the sidebar), starts
// the stream when it is not running, and polls for events itself when the stream could not be used.
async function chatTick(force = false) {
  if (!C.mounted) {
    chatMount();
    await chatHistory().catch((e) => chatNote(`读取之前的消息失败：${e.message}`, true));
  }
  C.tick++;
  if (C.live === "fallback") {
    // Polling after the stream failed three times; try the stream again now and then.
    if (C.tick % 30 === 0) C.live = null;
    else await chatPoll(force);
  }
  if (C.live !== "fallback" && !C.streaming) chatStream();
  // The file on screen is read again every few seconds; it is redrawn only when it changed.
  if (PANE.active && PANE.active !== "@files" && C.tick % 4 === 0) paneLoad(PANE.active);
  if (!force && !C.busy && !C.pending.length && !C.dirty && C.tick % 3) return;
  await chatState();
  // The panel and the sidebar read the database, so they refresh less often than events arrive.
  if (force || C.dirty || C.tick % 3 === 0) {
    // A finished review moves the calendar; otherwise it is read twice a minute.
    const calendar = force || C.dirty || !C.cal.data || C.tick % 30 === 0;
    C.dirty = false;
    await chatPanel().catch((e) => pulse(e.message));
    await chatConvs().catch((e) => pulse(e.message));
    if (calendar) await chatCalendar().catch((e) => pulse(e.message));
  }
}

async function chatPoll(force) {
  // Every second while something runs or waits; every third second when idle.
  if (!force && !C.busy && !C.pending.length && !C.expect && C.after && C.tick % 3) return;
  const d = await api(`/api/chat/events?after=${C.after}`);
  if (d.lost) chatNote("（较早的事件已不在内存中，刷新页面可从数据库读取对话）");
  await chatApply(d.events);
  C.after = d.next;
  chatSync(d);
}

async function chatApply(events) {
  for (const e of events) {
    if (e.kind === "switched") await chatSwitched(e);
    else chatEvent(e);
    if (e.kind === "idle") { C.expect = false; C.compacting = false; }
    C.after = Math.max(C.after, e.seq);
  }
  if (events.length) C.dirty = true;
}

// Whether a turn runs and what waits for an answer, from the poll or the stream's state frame.
function chatSync(d) {
  C.busy = d.busy;
  C.pending = d.pending;
  if (C.ask && !C.pending.some((p) => p.request_id === C.ask)) C.ask = null;
  // Switching is refused while a turn runs or a prompt waits; the sidebar says so instead of failing.
  const off = C.busy || C.pending.length > 0;
  $("#convs")?.classList.toggle("off", off);
  if ($("#convs")) $("#convs").title = off ? "先回答或停止当前提示" : "";
  const offnote = $("#convsoff");
  if (offnote) offnote.hidden = !off;
  if (!C.mounted) return;
  chatHead();
  chatControls();
}

// One SSE message: "id: …", "event: …" and "data: …" lines; comments (": ping") have neither.
function sseParse(block) {
  const m = {id: null, event: "message", data: []};
  for (const line of block.split("\n")) {
    if (!line || line.startsWith(":")) continue;
    const at = line.indexOf(":");
    const name = at < 0 ? line : line.slice(0, at);
    const value = at < 0 ? "" : line.slice(at + 1).replace(/^ /, "");
    if (name === "id") m.id = Number(value);
    else if (name === "event") m.event = value;
    else if (name === "data") m.data.push(value);
  }
  return {...m, data: m.data.length ? JSON.parse(m.data.join("\n")) : null};
}

function chatLive(text, error = false) {
  C.liveText = text;
  const node = $("#pulse");
  node.className = error ? "err" : "";
  node.textContent = text;
}

// Read the event stream until it ends or the chat is left. fetch rather than EventSource, so the token
// goes in a header and never into a URL. Reconnects after 1, 2, 4… (at most 10) seconds from the last
// event seen; after three failures in a row the tick polls instead.
async function chatStream() {
  C.streaming = true;
  const mine = C.gen = (C.gen || 0) + 1;
  let failures = 0;
  while (C.gen === mine && C.mounted && S.view === "chat") {
    const abort = C.abort = new AbortController();
    try {
      const response = await fetch(`/api/chat/stream?after=${C.after}`, {cache: "no-store", signal: abort.signal,
        headers: {"X-Zhiqiu-Token": WB.token, "Accept": "text/event-stream"}});
      if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.statusText);
      failures = 0;
      chatLive("实时连接");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true}).replace(/\r\n/g, "\n");
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          if (C.gen !== mine) return;
          await chatMessage(sseParse(block));
        }
      }
      throw new Error("连接已断开");
    } catch (e) {
      if (C.gen !== mine || e.name === "AbortError") return;
      failures++;
      chatLive("重连中…", true);
      if (failures >= 3) {
        C.live = "fallback";
        C.liveText = null;
        chatNote("实时连接失败，改为每秒查询一次；稍后会再试实时连接。", true);
        break;
      }
      await new Promise((r) => setTimeout(r, Math.min(1000 * 2 ** (failures - 1), 10000)));
    }
  }
  if (C.gen === mine) C.streaming = false;
}

async function chatMessage(m) {
  if (m.event === "hello" || m.event === "state") chatSync(m.data);
  else if (m.event === "gap") chatNote("（较早的事件已不在内存中，刷新页面可从数据库读取对话）");
  else if (m.data && m.id !== null) await chatApply([m.data]);
}

function chatUnmount() {
  // Leaving the chat (or rebuilding it) ends its stream; showing it again replays from the first event.
  C.gen = (C.gen || 0) + 1;
  C.abort?.abort();
  C.streaming = false;
  C.liveText = null;
}

async function chatSend() {
  const box = $("#say");
  const text = box.value.trim();
  if (!text || C.sending) return;
  if (/^\/view(\s|$)/.test(text) && !C.ask) {
    const path = text.slice(5).trim().replace(/^["']|["']$/g, "");
    if (path) paneOpen(path); else paneBrowse("");
    box.value = "";
    sayFit();
    return;
  }
  C.sending = true;
  // Any part of this input that came from a confirmed transcript marks it as voice.
  const source = V.voiced ? {input_source: "voice", voice_id: V.voiceId} : {};
  try {
    if (C.ask) await post("/api/chat/respond", {request_id: C.ask, value: text, ...source});
    else await post("/api/chat/input", {text, ...source});
    box.value = "";
    sayFit();
    voiceReset();
  } catch (e) {
    chatNote(`没有发出：${e.message}`, true);
  } finally {
    C.sending = false;
  }
  await chatTick(true).catch((e) => pulse(e.message));
  box.focus();
}

async function chatRespond(button) {
  const card = button.closest(".acard");
  card?.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  const grant = button.dataset.grantValue;
  let value = grant ? (grant === "root" ? `root:${card.querySelector("[data-grant-root]").value}` : grant) : button.dataset.value === "true";
  if (button.dataset.planValue) value = button.dataset.planValue;
  if (button.dataset.planSend) {
    const text = card.querySelector("[data-plan-say]").value.trim();
    if (!text) { card.querySelectorAll("button").forEach((b) => { b.disabled = false; }); return; }
    value = "say:" + text;
  }
  if (button.dataset.planPace) {
    const pace = {};
    card.querySelectorAll("[data-plan-field]").forEach((input) => {
      const name = input.dataset.planField;
      if (input.value !== input.defaultValue) pace[name] = input.type === "number" ? Number(input.value) : (input.value || null);
    });
    if (!Object.keys(pace).length) { card.querySelectorAll("button").forEach((b) => { b.disabled = false; }); chatNote("节奏没有改动。"); return; }
    value = "pace:" + JSON.stringify(pace);
  }
  try {
    await post("/api/chat/respond", {request_id: button.dataset.respond, value});
  } catch (e) {
    chatNote(`回答失败：${e.message}`, true);
    card?.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  }
  await chatTick(true).catch((e) => pulse(e.message));
}

// Time to the first piece of streamed replies: percentiles from five calls on, otherwise how many there are.
function ttftCell(x) {
  if (!x.ttft_samples) return '<span class="faint">—</span>';
  if (x.ttft_p50_ms == null) return `<span class="faint">样本不足（${num(x.ttft_samples)}）</span>`;
  return `${ms(x.ttft_p50_ms)}<span class="faint" style="font-size:12px"> / ${ms(x.ttft_p95_ms)}</span>`;
}

async function summary() {
  try {
    const s = await api(`/api/summary?days=${S.days}`);
    const set = (id, v, cls = "") => { const node = $(id); node.textContent = v ? num(v) : ""; node.className = "n " + cls; };
    set("#n-live", s.running, "live"); set("#n-traces", s.traces); set("#n-failures", s.failures, "hot"); set("#n-learn", s.attempts);
    set("#n-approvals", s.approvals_pending, "hot");
    set("#n-schedule", s.reviews_due, "hot");
  } catch (e) { /* the view's own poll reports errors */ }
}

function schedule(fn, every) {
  clearTimeout(S.timer);
  const token = {};
  S.token = token;
  const tick = async () => {
    let again = every;
    // A loader may return false to stop, or a number of milliseconds until its next refresh.
    try { const result = await fn(); if (result === false) again = 0; else if (typeof result === "number") again = result; pulse(); } catch (e) { pulse(e.message); }
    if (again && S.token === token) S.timer = setTimeout(tick, again);
  };
  tick();
}

const main = document.querySelector("main");
function route() {
  const [view, arg] = (location.hash.slice(1) || DEFAULT_VIEW).split("/");
  S.view = view === "trace" ? "traces" : view in VIEWS ? view : DEFAULT_VIEW;
  S.arg = arg ? decodeURIComponent(arg) : null;
  C.mounted = false;  // the chat rebuilds from its events whenever it is shown again
  chatUnmount();
  main.classList.toggle("chatview", S.view === "chat");
  main.scrollTop = 0;
  if (view === "trace" && S.arg) {
    let first = true;
    schedule(async () => { const running = await viewTrace(S.arg, !first); first = false; return running; }, 1500);
  } else if (view === "learn" && S.arg) {
    schedule(() => viewAttempt(S.arg), 0);
  } else if (view === "plans" && S.arg) {
    schedule(() => viewPlan(S.arg), 15000);
  } else {
    const loaders = {live: [viewLive, 1500], traces: [viewTraces, 5000], metrics: [viewMetrics, 15000], failures: [viewFailures, 15000], checks: [viewChecks, 15000], approvals: [viewApprovals, 5000], schedule: [viewSchedule, 15000], learn: [viewLearn, 15000], roots: [viewRoots, 0], plans: [viewPlans, 15000], chat: [chatTick, 1000]};
    schedule(...loaders[S.view]);
  }
}

if (WB.on) {
  // The workbench adds the chat on top of the observation pages; the read-only dashboard never shows it.
